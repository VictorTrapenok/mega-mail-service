---
- name: Check that the OS is supported
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version is version("24.04", ">=")
    fail_msg: >-
      The bench targets Ubuntu 24.04 LTS,
      found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# All timestamps in the reports are UTC. Otherwise a timezone change between
# runs turns into an unexplainable shift in the reconciliation.
- name: Set the timezone to UTC
  community.general.timezone:
    name: Etc/UTC

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true

- name: Apply the network sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ common_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Raise the file descriptor limit
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-postal-bench.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      * soft nofile 1048576
      * hard nofile 1048576

- name: Create the bench artifacts directory
  ansible.builtin.file:
    path: /opt/postal-bench
    state: directory
    owner: root
    group: root
    mode: "0755"
