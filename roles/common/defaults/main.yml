---
# Пакеты, нужные плейбукам и сборщику отчёта на всех хостах стенда.
common_packages:
  - ca-certificates
  - curl
  - jq
  - chrony
  - python3-pymysql
  - dnsutils
  - nftables

# Синхронизация времени. Латентность считается как разница отметок,
# снятых на РАЗНЫХ машинах, поэтому расхождение часов превращается
# в систематическую ошибку измерения и может давать отрицательные значения,
# которые потом молча отбрасываются, смещая распределение.
common_ntp_servers:
  - "pool.ntp.org"
common_clock_offset_max_ms: 5

# Сетевые лимиты генератора и sink'а.
#
# При дефолтном ip_local_port_range доступно около 28 000 портов, а TIME_WAIT
# держит сокет 60 с. Без переиспользования соединений это упирает устойчивую
# скорость новых подключений к одной паре адрес:порт примерно в 470/с —
# и выглядит это ровно как отказ Postal принимать соединения.
common_sysctls:
  net.ipv4.ip_local_port_range: "10240 65535"
  net.ipv4.tcp_tw_reuse: "1"
  net.core.somaxconn: "4096"
  net.ipv4.tcp_max_syn_backlog: "8192"
