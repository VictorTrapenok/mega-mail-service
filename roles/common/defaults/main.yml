---
# Packages required by the playbooks and the report builder on all bench hosts.
common_packages:
  - ca-certificates
  - curl
  - jq
  - chrony
  - python3-pymysql
  - dnsutils
  - nftables

# Time synchronisation. Latency is computed as the difference between timestamps
# taken on DIFFERENT machines, so a clock skew turns into
# a systematic measurement error and can produce negative values,
# which are then silently discarded, shifting the distribution.
common_ntp_servers:
  - "pool.ntp.org"
common_clock_offset_max_ms: 5

# Network limits of the generator and the sink.
#
# With the default ip_local_port_range about 28,000 ports are available, while TIME_WAIT
# holds a socket for 60 s. Without connection reuse this caps the sustained
# rate of new connections to a single address:port pair at roughly 470/s —
# and that looks exactly like Postal refusing to accept connections.
common_sysctls:
  net.ipv4.ip_local_port_range: "10240 65535"
  net.ipv4.tcp_tw_reuse: "1"
  net.core.somaxconn: "4096"
  net.ipv4.tcp_max_syn_backlog: "8192"
