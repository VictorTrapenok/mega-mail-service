---
# The HTTP API load balancer in front of the ingress processes.
#
# It is needed because ingress scales by processes, not by threads: MRI Ruby
# has a GVL, and a single Puma process does not perform compute work on more than
# one core. Talking to the first of several processes would measure one
# process instead of the system.

- name: Create the load balancer directory
  ansible.builtin.file:
    path: "{{ postal_lb_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ postal_lb_dir }}/haproxy.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the load balancer

- name: Deploy the load balancer compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postal_lb_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the load balancer

- name: Start the load balancer
  community.docker.docker_compose_v2:
    project_src: "{{ postal_lb_dir }}"
    state: present
    wait: true

- name: Apply the deferred load balancer restart
  ansible.builtin.meta: flush_handlers

# A balancer that came up with an empty or incomplete set of ingress processes
# would look like it is working, while the run would measure fewer processes than the
# report records. Hence we check the number of live backends, not the fact that it started.
- name: Wait for the ingress backends to become ready
  ansible.builtin.uri:
    url: "http://{{ svc_ip }}:{{ postal_lb_stats_port }}/;csv"
    return_content: true
  register: postal_lb_stats
  until: >-
    (postal_lb_stats.content | default('')).split('\n')
    | select('search', '^postal_web,web-')
    | select('search', ',UP,')
    | list | length == (groups['postal_web']
                        | map('extract', hostvars, 'postal_web_replicas')
                        | map('int') | sum)
  retries: 30
  delay: 2
