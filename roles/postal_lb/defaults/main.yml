---
# Предел одновременных соединений. Должен покрывать число виртуальных
# пользователей генератора: по закону Литтла оно равно целевой скорости,
# умноженной на латентность приёма, и на перегрузе доходило до полутора тысяч.
# Балансировщик, упирающийся в свой лимит, выглядел бы отказом Postal.
postal_lb_maxconn: 16384

# Больше худшей наблюдавшейся латентности приёма: под перегрузом она доходила
# до минуты, и более короткий таймаут показал бы отказы там, где их нет.
postal_lb_timeout: "180s"
