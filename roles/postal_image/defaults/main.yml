---
# Rebuild even when an image built from exactly this source already exists.
# Needed after changing the Dockerfile's base image or after clearing the layer cache;
# not needed to pick up source edits, which change the tag by themselves.
#
# Only this role reads it, which is why it may stay a role default. postal_build_source_dir
# and postal_build_pull may not: postal_specs reads them too, and a role default is out of
# scope in any play that does not include that role.
postal_build_force: false
