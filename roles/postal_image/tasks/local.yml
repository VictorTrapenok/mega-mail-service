---
# Building the Postal image from our Postal source in vendor/postal.
#
# The tag is derived from the CONTENT of the source tree, not from a version string.
# Two reasons, and both matter more here than tidiness:
#
#   A hand-maintained tag lies the moment someone forgets to bump it. The whole point of
#   this path is to run an EDITED worker or an added index, and an image tagged "dev"
#   cannot tell anyone whether the edit is inside it. A content hash can.
#
#   It also makes the build free when nothing changed: the tag already exists, the build
#   is skipped, and that is what allows every measurement playbook to ask for a build
#   unconditionally before the run without paying for it.
#
# The hash is git's own tree object id for vendor/postal, taken through a THROW-AWAY index
# so it describes the working tree rather than the last commit. Everything below follows
# from that choice:
#
#   It is genuinely a function of the content. The first attempt hashed a tar archive with
#   the metadata zeroed, and that turned out to depend on the tar version — GNU tar 1.34 and
#   1.35 hashed byte-identical trees to 52733cbabb11 and 722b34598b73 — so a workstation and
#   a CI runner disagreed about what the same source was called. A git tree id has one
#   definition and every git computes it identically.
#
#   It covers exactly what a checkout covers. `git add` honours .gitignore, so a stray
#   vendor/bundle left behind by somebody running bundle install there changes neither
#   the hash nor the image, and the tag keeps meaning "the code CI would build".
#
#   The same tree id is then exported with `git archive`, so the bytes shipped to the host
#   are the bytes the hash describes rather than a similar set of files.

- name: Make sure the Postal source is present
  ansible.builtin.stat:
    path: "{{ postal_build_source_dir }}/Dockerfile"
  delegate_to: localhost
  become: false
  changed_when: false
  register: postal_build_dockerfile

- name: Fail when there is nothing to build
  ansible.builtin.assert:
    that:
      - postal_build_dockerfile.stat.exists
    fail_msg: >-
      {{ postal_build_source_dir }}/Dockerfile is missing, so there is no source to build.
      Restore it (see docs/custom-builds.md) or deploy the reference image with
      -e postal_image_source=upstream.

# Kept identical to the snippet in .github/workflows/postal-image.yml and in the
# postal_specs role. Three copies is two too many, but the alternative — a script file the
# workflow also has to call — hides the one thing a reader needs to see in each place.
- name: Compute the source identity
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      idx="$(mktemp)"
      trap 'rm -f "$idx"' EXIT
      export GIT_INDEX_FILE="$idx"
      git read-tree HEAD >/dev/null 2>&1 || git read-tree --empty
      git add -A -- {{ postal_build_source_rel | quote }}
      git write-tree --prefix={{ postal_build_source_rel | quote }}/
    chdir: "{{ postal_build_repo_dir }}"
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  register: postal_build_tree

- name: Fail when the source identity could not be computed
  ansible.builtin.assert:
    that:
      - postal_build_tree.rc == 0
      - postal_build_tree.stdout | trim | length == 40
    fail_msg: >-
      Could not read a git tree id for {{ postal_build_source_rel }} under
      {{ postal_build_repo_dir }}: {{ postal_build_tree.stderr | default('') | trim }}.
      The source has to live inside a git working tree — that is where the build identity
      comes from. A downloaded zip will not do.

- name: Pin the build identity
  ansible.builtin.set_fact:
    postal_build_source_digest: "{{ postal_build_tree.stdout | trim }}"
    postal_image_resolved: >-
      {{ postal_build_image_repo }}:src-{{ (postal_build_tree.stdout | trim)[:12] }}
    cacheable: true

- name: Look for an image already built from exactly this source
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "--format"
      - "{% raw %}{{.Id}}{% endraw %}"
      - "{{ postal_image_resolved }}"
  register: postal_build_existing
  failed_when: false
  changed_when: false

- name: Decide whether a build is needed
  ansible.builtin.set_fact:
    postal_build_needed: "{{ postal_build_force | bool or postal_build_existing.rc != 0 }}"

- name: Create a temporary file for the source archive
  ansible.builtin.tempfile:
    state: file
    suffix: .tar
  delegate_to: localhost
  become: false
  changed_when: false
  when: postal_build_needed | bool
  register: postal_build_archive

# Exported from the tree id that was just hashed, so the build context cannot contain
# anything the identity does not account for.
- name: Export the source tree
  ansible.builtin.command:
    argv:
      - git
      - archive
      - "--format=tar"
      - "--prefix={{ postal_build_source_rel | basename }}/"
      - "-o"
      - "{{ postal_build_archive.path }}"
      - "{{ postal_build_source_digest }}"
    chdir: "{{ postal_build_repo_dir }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: postal_build_needed | bool

# Wiped rather than overwritten: unarchive adds and replaces files but never removes them,
# so a file deleted from the source would survive in the context and go on being built in.
- name: Reset the build context directory
  ansible.builtin.file:
    path: "{{ postal_build_dir }}"
    state: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [absent, directory]
  when: postal_build_needed | bool

- name: Unpack the source on the build host
  ansible.builtin.unarchive:
    src: "{{ postal_build_archive.path }}"
    dest: "{{ postal_build_dir }}"
    owner: root
    group: root
  when: postal_build_needed | bool

- name: Build the Postal image
  ansible.builtin.command:
    argv:
      - docker
      - build
      # The default target is `full` and it is named anyway. `ci` skips asset
      # precompilation, and production.rb has config.assets.compile = false, so web then
      # returns 500 on every page while a TCP health check still reports it alive. That is
      # the same trap postal_image_forbidden_refs exists for on the reference-image path.
      - "--target"
      - full
      # Kept false by default: the base image tag ruby:3.4.6-slim-bookworm moves, and
      # re-pulling it mid-series would change the build under a series that is supposed to
      # differ only in our own source.
      - "--pull={{ postal_build_pull | lower }}"
      - "--build-arg"
      - "VERSION={{ postal_version }}"
      - "--build-arg"
      - "BRANCH=bench-{{ postal_build_source_digest[:12] }}"
      # Baked in so the report can read the source identity off the RUNNING container
      # rather than trust the tag it was asked to deploy. A tag is what someone meant to
      # run; a label on the running image is what actually ran.
      - "--label"
      - "bench.source.tree={{ postal_build_source_digest }}"
      - "--label"
      - "bench.postal.version={{ postal_version }}"
      - "--tag"
      - "{{ postal_image_resolved }}"
      - "{{ postal_build_dir }}/{{ postal_build_source_rel | basename }}"
  when: postal_build_needed | bool
  changed_when: true

- name: Remove the temporary source archive
  ansible.builtin.file:
    path: "{{ postal_build_archive.path }}"
    state: absent
  delegate_to: localhost
  become: false
  changed_when: false
  when: postal_build_needed | bool

- name: Read the identity of the image that will be deployed
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "--format"
      - "{% raw %}{{.Id}}{% endraw %}"
      - "{{ postal_image_resolved }}"
  register: postal_build_id
  changed_when: false

- name: Pin the built image identity
  ansible.builtin.set_fact:
    postal_build_image_id: "{{ postal_build_id.stdout | trim }}"
    cacheable: true

- name: Show which image will be deployed
  ansible.builtin.debug:
    msg: >-
      Postal {{ postal_version }}: {{ postal_image_resolved }} ({{ postal_build_image_id }}),
      built from vendor/postal
      {{ '(rebuilt now)' if postal_build_needed | bool else '(already built from this source)' }}
