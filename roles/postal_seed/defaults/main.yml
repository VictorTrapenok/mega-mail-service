---
# Обход проверки домена через DNS.
#
# По умолчанию выключен: записи отдаёт наш собственный резолвер, и проверка
# должна проходить честно. Резолвинг остаётся на горячем пути доставки
# (Postal открывает новый Resolv::DNS на каждый запрос, не меньше трёх запросов
# на доставку) и сам по себе является кандидатом в узкое место — обходя
# верификацию, легко получить стенд, в котором DNS не проверен вообще.
#
# Если включить, факт попадает в отчёт как снижение достоверности прогона.
postal_force_domain_verification: false

postal_seed_script: /opt/postal-bench/postal/scripts/seed.rb
