---

# The webhook sink lives on the load balancer host. Without one the URL below cannot be
# built, and the failure would otherwise arrive as a Jinja error inside a template.
- name: Check that the webhook sink has somewhere to live
  ansible.builtin.assert:
    that:
      - (groups['postal_load_balancers'] | default([]) | length) > 0
    fail_msg: >-
      Profile "{{ bench_profile }}" enables webhooks, but the postal_load_balancers group is
      empty, and that host is where the webhook sink runs. Either add a host to the group or
      set webhooks: false for this profile in group_vars/all/50-bench.yml.
  when: bench_profiles[bench_profile].webhooks | default(false) | bool
- name: Deploy the seeding script
  ansible.builtin.template:
    src: seed.rb.j2
    dest: "{{ postal_seed_script }}"
    owner: root
    group: root
    mode: "0644"

- name: Run the seeding
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ postal_dir }}/docker-compose.yml"
      - "--profile"
      - tools
      - run
      - "--rm"
      - "-T"
      - runner
      - bundle
      - exec
      - rails
      - runner
      - /scripts/seed.rb
  register: postal_seed_run
  changed_when: true

- name: Parse the seeding result
  ansible.builtin.set_fact:
    postal_seed: >-
      {{ (postal_seed_run.stdout_lines
          | select('match', '^POSTAL_SEED_JSON:')
          | first
          | regex_replace('^POSTAL_SEED_JSON:', '')) | from_json }}
    cacheable: true

- name: Show details of the seeded server
  ansible.builtin.debug:
    msg: >-
      server_id={{ postal_seed.server_id }}
      message_db={{ postal_seed.message_db_name }}
      domain={{ postal_seed.domain_name }}
      verified={{ postal_seed.domain_verified }}
