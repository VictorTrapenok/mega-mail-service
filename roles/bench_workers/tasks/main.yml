---
# Moving the delivery workers to a given state.
#
# Needed in order to measure ingress and queue draining separately. With the workers
# running, these two processes compete for the same cores and the same
# DB, and a single output number does not tell which of the two halves
# is falling short of the target.
#
# The role is NON-idempotent by intent: it changes the bench state on the playbook's
# demand rather than bringing it to the shape described in the inventory.

- name: Enumerate the worker services
  ansible.builtin.set_fact:
    bench_worker_services: >-
      {{ range(1, (postal_worker_replicas | int) + 1) | map('regex_replace', '^', 'worker') | list }}

# The role is also included from broad measurement plays, which besides the workers cover
# the generator and the sink. Those have no Postal compose file at all, so
# group membership is checked inside the role, not only in the playbook.
- name: Stop the workers
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '-f', postal_dir ~ '/docker-compose.yml', 'stop']
         + bench_worker_services }}
  changed_when: true
  when:
    - bench_workers_state == 'stopped'
    - inventory_hostname in groups['postal_workers']

- name: Make sure no worker is running
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ postal_dir }}/docker-compose.yml", ps, --status, running, --services]
  changed_when: false
  register: bench_running_services
  # Otherwise the ingress measurement would silently get a running competitor, and the
  # conclusion about the ingress rate would be overstated by an unknown amount.
  failed_when: >-
    bench_running_services.stdout_lines | select('in', bench_worker_services) | list | length > 0
  when:
    - bench_workers_state == 'stopped'
    - inventory_hostname in groups['postal_workers']

# Stopping leaves the claimed rows locked: bin/postal starts Ruby
# without exec, so PID 1 inside the container is bash, and the signal handlers
# do not fire on docker stop. Such rows are not picked up by the cleanup task either:
# it only reacts to a lock older than queued_message_lock_stale_days, i.e.
# after 30 days. Without unlocking they fall out of the queue forever, the drain
# never reaches zero, and the reconciliation shows an unexplained shortfall.
- name: Clear orphaned queue locks
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: >-
      UPDATE queued_messages SET locked_by = NULL, locked_at = NULL
       WHERE locked_at IS NOT NULL
  register: bench_unlocked
  changed_when: (bench_unlocked.rowcount | default([0]) | first | int) > 0
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  when: bench_workers_state == 'stopped'

- name: Start the workers
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '-f', postal_dir ~ '/docker-compose.yml', 'start']
         + bench_worker_services }}
  changed_when: true
  when:
    - bench_workers_state == 'running'
    - inventory_hostname in groups['postal_workers']

# The moment from which a worker actually takes jobs determines the denominator
# of the drain rate. Without waiting for readiness, the measured time would also include
# the Ruby startup, and that is several seconds on a run lasting minutes.
- name: Wait for the workers to become ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ (postal_worker_health_port_base | int) + item }}/health"
    status_code: [200]
  register: bench_worker_health
  until: bench_worker_health is succeeded
  retries: 30
  delay: 2
  loop: "{{ range(0, postal_worker_replicas | int) | list }}"
  when:
    - bench_workers_state == 'running'
    - inventory_hostname in groups['postal_workers']
