---
# Bringing the bench to an identical starting state.
#
# This role is destructive and non-idempotent BY DESIGN: the build comparison protocol
# requires an identical DB and queue state before every run.
# Making it idempotent would quietly break the comparison.

- name: Clear the queue
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "TRUNCATE TABLE queued_messages"
  changed_when: true

# With webhooks enabled every delivery leaves a row here, and the worker keeps retrying the
# failed ones. Left in place they would carry into the next run as work that has nothing to
# do with it.
- name: Clear the webhook queue
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "TRUNCATE TABLE webhook_requests"
  changed_when: true

# Two HardFails per address within a day move all subsequent messages to it into Held.
# Without clearing, the suppression list carries over between runs of a series,
# and the second run starts under different conditions than the first.
- name: Clear the suppression list
  community.mysql.mysql_query:
    login_host: "{{ postal_message_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_seed.message_db_name }}"
    query: "TRUNCATE TABLE suppressions"
  changed_when: true
  failed_when: false

# Recreating the message database through Postal itself: the provisioner performs
# DROP + CREATE + migrations and along the way removes the per-day raw-* tables.
# A plain TRUNCATE would not touch them, and the next run would start
# with a different disk occupancy profile.
- name: Recreate the message database
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ postal_dir }}/docker-compose.yml"
      - "--profile"
      - tools
      - run
      - "--rm"
      - "-T"
      - runner
      - bundle
      - exec
      - rails
      - runner
      - "Server.find({{ postal_seed.server_id }}).message_db.provisioner.provision"
  delegate_to: "{{ groups['postal_admin'] | first }}"
  run_once: true
  changed_when: true

- name: Make sure no raw-* tables are left
  community.mysql.mysql_query:
    login_host: "{{ postal_message_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    query: >-
      SELECT COUNT(*) AS n FROM information_schema.tables
      WHERE table_schema = '{{ postal_seed.message_db_name }}'
        AND table_name LIKE 'raw-%'
  register: raw_tables
  changed_when: false
  failed_when: (raw_tables.query_result[0][0].n | int) > 0

- name: Clear the sink logs
  ansible.builtin.shell:
    cmd: ": > {{ postfix_sink_log }}"
  args:
    executable: /bin/bash
  delegate_to: "{{ item }}"
  loop: "{{ groups['postfix_sinks'] }}"
  changed_when: true

# Reset on ALL hosts with containment, not only the current one:
# the counter is read by the report as a total, and an unreset remainder on a neighbouring
# host would look like a leak in this run.
- name: Zero the leak attempt counters
  ansible.builtin.command:
    argv: [nft, reset, counter, inet, mailguard, smtp_escape_attempts]
  delegate_to: "{{ item }}"
  loop: "{{ containment_hosts }}"
  changed_when: true
