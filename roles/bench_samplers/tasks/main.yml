---
# Starting and stopping the run samplers.
#
# They are factored into a separate role because three measurements use them: ingress,
# drain and the combined run. Queue depth is sampled only on the host of the
# main DB, resource consumption on every run host.

- name: Create the run directory
  ansible.builtin.file:
    path: "{{ bench_dir }}/{{ bench_run_id }}"
    state: directory
    owner: root
    group: root
    mode: "0777"
  when: bench_samplers_state == 'started'

- name: Lay out the samplers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ bench_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - queue_sampler.sh
    - stats_sampler.sh
  when: bench_samplers_state == 'started'

- name: Start the queue sampler
  ansible.builtin.shell:
    cmd: >-
      nohup {{ bench_dir }}/queue_sampler.sh
      {{ bench_dir }}/{{ bench_run_id }}/queue.csv
      > /dev/null 2>&1 & echo $!
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - bench_samplers_state == 'started'
    - inventory_hostname in groups['postal_main_db']

- name: Start the resource sampler
  ansible.builtin.shell:
    cmd: >-
      nohup {{ bench_dir }}/stats_sampler.sh
      {{ bench_dir }}/{{ bench_run_id }}/stats-{{ inventory_hostname }}.csv
      > /dev/null 2>&1 & echo $!
  args:
    executable: /bin/bash
  changed_when: true
  when: bench_samplers_state == 'started'

- name: Stop the samplers
  ansible.builtin.shell:
    cmd: "pkill -f '{{ bench_dir }}/(queue|stats)_sampler.sh' || true"
  args:
    executable: /bin/bash
  changed_when: true
  when: bench_samplers_state == 'stopped'

# We fetch here rather than in the measuring roles: the samplers keep appending to the CSV
# until they are stopped, and a copy taken earlier would break off in the middle of the run.
# Without transferring it to the control machine the run artifact is not self-contained,
# and it is precisely self-containedness that makes the result publishable.
- name: Fetch the sampler CSV files to the control machine
  ansible.builtin.fetch:
    src: "{{ item }}"
    dest: "{{ bench_reports_dir }}/{{ bench_run_id }}/"
    flat: false
    fail_on_missing: false
  loop:
    - "{{ bench_dir }}/{{ bench_run_id }}/queue.csv"
    - "{{ bench_dir }}/{{ bench_run_id }}/stats-{{ inventory_hostname }}.csv"
  when: bench_samplers_state == 'stopped'
