---
- name: Determine the sink hostname
  ansible.builtin.set_fact:
    postfix_sink_hostname: "sink-{{ (groups['postfix_sinks'].index(inventory_hostname) | int) + 1 }}.{{ postal_test_domain }}"

- name: Create the sink directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ postfix_sink_dir }}"
    - "{{ postfix_sink_dir }}/build"
    - "{{ postfix_sink_dir }}/conf"
    - "{{ postfix_sink_dir }}/log"

- name: Lay out the image build context
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ postfix_sink_dir }}/build/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - Dockerfile
    - entrypoint.sh
  notify: Rebuild the sink

- name: Deploy main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: "{{ postfix_sink_dir }}/conf/main.cf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the sink

- name: Deploy master.cf
  ansible.builtin.template:
    src: master.cf.j2
    dest: "{{ postfix_sink_dir }}/conf/master.cf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the sink

- name: Deploy the sink compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postfix_sink_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the sink

- name: Build and start the sink
  community.docker.docker_compose_v2:
    project_src: "{{ postfix_sink_dir }}"
    build: policy
    state: present
    wait: true

- name: Apply the deferred sink handlers
  ansible.builtin.meta: flush_handlers

# The presence of a process in the system capable of opening an outbound SMTP connection
# defeats the entire containment line on the sink side.
- name: Make sure there are no outbound delivery services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ postfix_sink_dir }}/docker-compose.yml"
      - exec
      - "-T"
      - sink
      - postconf
      - "-M"
  register: sink_master
  changed_when: false
  # smtp/inet/smtpd is the sink's inbound server. Outbound delivery is possible
  # via the unix transports smtp, relay, lmtp, local and virtual.
  failed_when: >-
    sink_master.stdout_lines
    | select('match', '^(smtp|relay|lmtp|local|virtual)\\s+unix\\b')
    | list | length > 0

# --- Proof that the per-IP limits bind -------------------------------------
# A limit that is configured but not enforced is the worst outcome available here: the run
# looks like a throttled one, produces no rejections, and its numbers get quoted as "Postal
# copes with provider limits". It has already happened on this bench twice over — the caps
# were exempt for $mynetworks, and every sending address has to be in mynetworks to relay at
# all; and master.cf had no anvil service, without which the caps are not implemented at all.
# Both failures are silent and look identical from the outside.
#
# So the limit is proven by exercising it, the way postal_sending_ips proves an address with
# a real MAIL FROM rather than with a ping. The probe runs FROM A WORKER HOST, not from the
# sink and not from the loopback: every exempt address would sail past the cap and the probe
# would pass against a sink enforcing nothing. Running it from where the mail actually comes
# from is the only version of this check that cannot pass vacuously.

# The exemption list is the second way a limit becomes dead configuration, and it fails in
# exactly the same silent shape as a missing anvil: everything deploys, nothing is refused,
# and the run reads as "Postal copes". It happens whenever an exempt address is also a
# sending address — which is the normal state of the single-host layout, where the generator
# and the workers are the same machine.
- name: Check that no exempt address is also a sending address
  ansible.builtin.assert:
    that:
      - (postfix_sink_ratelimit_exempt | intersect(postal_sending_addrs + postal_worker_addrs)) | length == 0
    fail_msg: >-
      {{ postfix_sink_ratelimit_exempt | intersect(postal_sending_addrs + postal_worker_addrs) | join(', ') }}
      is exempt from the per-IP limits and is also an address Postal sends from, so the limits
      would apply to nobody while the run still looked throttled. This is the normal case on a
      single host: a throttled arm needs the generator and the workers on different machines.
      Use the distributed inventory, or override postfix_sink_ratelimit_exempt.
  when: bench_sink_throttled | bool

- name: Check that anvil is present whenever any per-IP limit is set
  ansible.builtin.assert:
    that:
      - sink_master.stdout_lines | select('match', '^anvil\\s+unix\\b') | list | length > 0
    fail_msg: >-
      A per-IP limit is configured but master.cf has no anvil service. Those limits are not
      implemented inside smtpd — they are a query to private/anvil — so the cap would apply
      to nobody while every connection still paid for the failed lookup.
  when: bench_sink_throttled | bool

- name: Prove that the connection cap rejects over the limit
  ansible.builtin.command:
    argv:
      - python3
      - "-c"
      - |
        import socket, sys
        host, limit, port = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
        # The cap counts SIMULTANEOUS sessions, so every socket is held open. Reading a
        # banner and closing before opening the next one would free the slot each time and
        # the cap would never be reached, making the probe pass on an unenforced sink.
        held, banners = [], []
        try:
            for _ in range(limit + 1):
                held.append(socket.create_connection((host, port), timeout=15))
            for s in held:
                s.settimeout(15)
                banners.append(s.recv(1024).decode("utf-8", "replace").strip())
        finally:
            for s in held:
                try:
                    s.close()
                except OSError:
                    pass
        if not [b for b in banners if b.startswith("421")]:
            raise SystemExit(
                "%d simultaneous connections against a cap of %d were all accepted: the cap "
                "is not enforced. Banners: %s" % (len(banners), limit, banners))
      - "{{ svc_ip }}"
      - "{{ postfix_sink_client_connection_limit }}"
      - "{{ postfix_sink_port }}"
  delegate_to: "{{ groups['postal_workers'] | first }}"
  changed_when: false
  when: (postfix_sink_client_connection_limit | int) > 0

# --- Artificial response latency -------------------------------------------
# A sink that answers instantly measures the upper bound of Postal, not production
# speed: draining is waiting on the network, and its ceiling equals concurrency
# divided by the delivery latency. The delay is applied to the network rather than
# to Postfix, so the sink remains a real Postfix with a queue and a discard transport.

- name: Determine the interface that carries the service address
  ansible.builtin.shell:
    cmd: ip -o -4 addr show | awk -v ip="{{ svc_ip }}" '$4 ~ "^"ip"/" {print $2; exit}'
  args:
    executable: /bin/bash
  register: sink_iface
  changed_when: false

- name: Check that the interface was found
  ansible.builtin.assert:
    that:
      - (sink_iface.stdout | trim) | length > 0
    fail_msg: >-
      No interface carries {{ svc_ip }}. Without knowing it the delay would have to be
      applied to every interface, and that would delay SSH along with SMTP.

# Removing it unconditionally makes the state deterministic: a leftover qdisc from
# a previous run would silently add latency to a run that did not ask for it.
- name: Remove the previous traffic shaping
  ansible.builtin.command:
    argv: [tc, qdisc, del, dev, "{{ sink_iface.stdout | trim }}", root]
  changed_when: true
  failed_when: false

- name: Apply the response delay
  ansible.builtin.shell:
    cmd: |
      set -e
      IFACE="{{ sink_iface.stdout | trim }}"
      # prio sends everything the filter does not match into band 1:1, which has no
      # delay attached. That is what keeps the control connection unaffected.
      tc qdisc add dev "$IFACE" root handle 1: prio bands 3
      tc qdisc add dev "$IFACE" parent 1:3 handle 30: netem delay {{ postfix_sink_response_delay_ms }}ms
      tc filter add dev "$IFACE" protocol ip parent 1:0 prio 1 \
        u32 match ip sport {{ postfix_sink_port }} 0xffff flowid 1:3
    executable: /bin/bash
  changed_when: true
  when: (postfix_sink_response_delay_ms | int) > 0

- name: Report the delay in effect
  ansible.builtin.debug:
    msg: >-
      {{ 'The sink answers with a delay of ' ~ postfix_sink_response_delay_ms ~ ' ms per response on '
         ~ (sink_iface.stdout | trim)
         if (postfix_sink_response_delay_ms | int) > 0
         else 'The sink answers without an artificial delay: the result is an upper bound, not a forecast.' }}
