---

# The marker that Postfix writes to the log as "status=sent (delivered-to-sink)".
# Delivery is counted by it independently of Postal — the only source
# that does not depend on the object being measured.

# The Postfix defaults would limit the bench before Postal does, and that would look
# like a measurement result for Postal. Every value below lifts a specific
# documented limit.
postfix_sink_tuning:
  # The default of 1s is documented as limiting reception to roughly
  # 100 messages per second above the delivery rate.
  in_flow_delay: "0s"
  # All Postal workers arrive from a handful of addresses, while the default is 50 concurrent
  # connections per client IP, after which smtpd answers
  # "421 4.7.0 <host> Error: too many connections from <ip>" while the cores sit idle.
  #
  # Every limit in this block is enforced by the anvil service, NOT by smtpd itself. The
  # service must be present in master.cf or the limit is dead configuration — see the note
  # there. The reply strings were read out of the smtpd binary rather than guessed, because
  # the counters in bench_drain match on them and a wrong string counts zero forever:
  #   count / connection rate  ->  421 4.7.0 %s Error: too many connections from %s
  #   message rate             ->  450 4.7.1 Error: too much mail from %s
  #   recipient rate           ->  450 4.7.1 Error: too many recipients from %s
  smtpd_client_connection_count_limit: "{{ postfix_sink_client_connection_limit }}"
  # Without this the caps above are dead configuration. Postfix exempts
  # $mynetworks from client event limits by default, and every sending address has to be in
  # mynetworks to be allowed to relay at all — so the cap applied to nobody. Measured:
  # with a cap of 10 and 32 concurrent sessions from one address, not a single rejection.
  # Exempt: the loopback and the load generator. The generator is not a sender under test —
  # it drives calibration straight into the sink to establish the chain's raw capacity, and a
  # cap applied to it would make calibrate.yml measure the cap and refuse to start every run.
  # Relay permission is unaffected either way.
  #
  # In a single-host layout the generator and the workers share an address, so exempting one
  # exempts the other and the throttling silently applies to nobody. That is checked for
  # rather than commented about — see the guard in tasks/main.yml.
  smtpd_client_event_limit_exceptions: "{{ (['127.0.0.0/8'] + postfix_sink_ratelimit_exempt) | join(', ') }}"
  # Rate limits, unlike the concurrency cap above, are what actually models a provider's
  # volume throttling: a cap on simultaneous sessions is invisible while the sender is
  # slower than the cap, whereas a rate cap binds at any concurrency.
  smtpd_client_connection_rate_limit: "{{ postfix_sink_client_connection_rate_limit }}"
  smtpd_client_message_rate_limit: "{{ postfix_sink_client_message_rate_limit }}"
  smtpd_client_recipient_rate_limit: "{{ postfix_sink_client_recipient_rate_limit }}"
  # The window all three rates are counted over. Postfix defaults to 60s; it is stated
  # explicitly because the profile numbers are meaningless without it.
  anvil_rate_time_unit: "{{ postfix_sink_anvil_rate_time_unit }}"
  default_process_limit: "400"
  qmgr_message_active_limit: "100000"
  smtpd_error_sleep_time: "0s"
  smtpd_soft_error_limit: "1000"
  smtpd_hard_error_limit: "1000"
  # A reverse DNS lookup per connection is an extra round trip to the resolver
  # on the hot ingress path.
  smtpd_peername_lookup: "no"
  disable_dns_lookups: "yes"

# Must be no smaller than Postal's SMTP_SERVER_MAX_MESSAGE_SIZE,
# otherwise large messages are rejected at the boundary and this gets blamed on a Postal defect.
postfix_sink_message_size_limit: "{{ (postal_smtp_max_message_size | int) * 1024 * 1024 }}"

# The queue on tmpfs: with the discard transport a message travels the full path
# through cleanup and the queue with an fsync before the 250 reply, and on an ordinary disk
# it is exactly that fsync which becomes the ingress ceiling.
postfix_sink_spool_tmpfs_size: "2g"

# Addresses exempt from the per-IP limits, on top of the loopback. The generator by default:
# it is the measuring instrument, not a sender under test.
postfix_sink_ratelimit_exempt: "{{ loadgen_addrs | default([]) }}"
