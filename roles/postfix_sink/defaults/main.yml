---

# Метка, которую Postfix пишет в лог как «status=sent (delivered-to-sink)».
# По ней считается доставка независимо от Postal — единственный источник,
# не зависящий от самого объекта измерения.

# Дефолты Postfix ограничат стенд раньше Postal, и это будет выглядеть
# как результат измерения Postal. Каждое значение ниже отменяет конкретный
# документированный лимит.
postfix_sink_tuning:
  # Дефолт 1s документирован как ограничивающий приём примерно
  # 100 сообщениями в секунду сверх скорости доставки.
  in_flow_delay: "0s"
  # Все воркеры Postal приходят с горстки адресов, а дефолт — 50 соединений
  # на клиентский IP, после чего однопроцессный anvil начинает отвечать
  # «450 4.7.1 Error: too many connections» при простаивающих ядрах.
  smtpd_client_connection_count_limit: "0"
  smtpd_client_connection_rate_limit: "0"
  smtpd_client_message_rate_limit: "0"
  smtpd_client_recipient_rate_limit: "0"
  default_process_limit: "400"
  qmgr_message_active_limit: "100000"
  smtpd_error_sleep_time: "0s"
  smtpd_soft_error_limit: "1000"
  smtpd_hard_error_limit: "1000"
  # Обратный DNS на каждое соединение — лишний круг к резолверу
  # на горячем пути приёма.
  smtpd_peername_lookup: "no"
  disable_dns_lookups: "yes"

# Должен быть не меньше, чем SMTP_SERVER_MAX_MESSAGE_SIZE у Postal,
# иначе большие письма отобьются на границе и это спишут на дефект Postal.
postfix_sink_message_size_limit: "{{ (postal_smtp_max_message_size | int) * 1024 * 1024 }}"

# Очередь на tmpfs: при discard-транспорте письмо проходит полный путь
# через cleanup и очередь с fsync перед ответом 250, и на обычном диске
# именно fsync становится потолком приёма.
postfix_sink_spool_tmpfs_size: "2g"
