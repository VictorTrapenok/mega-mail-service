---
- name: Rebuild the sink
  community.docker.docker_compose_v2:
    project_src: "{{ postfix_sink_dir }}"
    build: always
    state: present
    recreate: always
    wait: true

- name: Restart the sink
  community.docker.docker_compose_v2:
    project_src: "{{ postfix_sink_dir }}"
    state: restarted
    wait: true
