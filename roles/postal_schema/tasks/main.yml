---
# postal initialize — это `rake db:create postal:update`. В версии 3 задача
# postal:update ветвится: если таблица schema_migrations существует и не пуста,
# выполняется db:migrate, иначе db:schema:load. Поэтому повторный запуск
# на уже инициализированной установке безопасен.
#
# Важное отличие от версии 2, где initialize был безусловным
# db:create db:schema:load db:seed и при повторе действительно ронял схему.
#
# Единственный опасный край: если schema_migrations пуста, а данные есть,
# ветка db:schema:load пересоздаст таблицы (schema.rb использует
# force: :cascade). В штатной работе это не воспроизводится.

- name: Дождаться доступности MariaDB
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT 1"
  register: db_ready
  until: db_ready is succeeded
  retries: 30
  delay: 5
  changed_when: false

- name: Инициализировать схему Postal
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ postal_dir }}/docker-compose.yml"
      - "--profile"
      - tools
      - run
      - "--rm"
      - "-T"
      - runner
      - postal
      - initialize
  register: postal_init
  changed_when: "'Nothing to do' not in postal_init.stdout"

- name: Проверить, что основная схема создана
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT COUNT(*) AS n FROM schema_migrations"
  register: schema_check
  changed_when: false
  failed_when: (schema_check.query_result[0][0].n | int) == 0

- name: Зафиксировать версию схемы для отчёта
  ansible.builtin.set_fact:
    stand_schema_migrations: "{{ schema_check.query_result[0][0].n }}"
    cacheable: true
