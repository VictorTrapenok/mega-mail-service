---
# postal initialize is `rake db:create postal:update`. In version 3 the
# postal:update task branches: if the schema_migrations table exists and is not empty,
# db:migrate runs, otherwise db:schema:load. Hence re-running it
# on an already initialised installation is safe.
#
# An important difference from version 2, where initialize was an unconditional
# db:create db:schema:load db:seed and re-running it really did destroy the schema.
#
# The only dangerous edge: if schema_migrations is empty but data exists,
# the db:schema:load branch will recreate the tables (schema.rb uses
# force: :cascade). This does not occur during normal operation.

- name: Wait for MariaDB to become available
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT 1"
  register: db_ready
  until: db_ready is succeeded
  retries: 30
  delay: 5
  changed_when: false

- name: Initialise the Postal schema
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ postal_dir }}/docker-compose.yml"
      - "--profile"
      - tools
      - run
      - "--rm"
      - "-T"
      - runner
      - postal
      - initialize
  register: postal_init
  changed_when: "'Nothing to do' not in postal_init.stdout"

- name: Check that the main schema was created
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT COUNT(*) AS n FROM schema_migrations"
  register: schema_check
  changed_when: false
  failed_when: (schema_check.query_result[0][0].n | int) == 0

- name: Check web over HTTP after the schema has been initialised
  ansible.builtin.uri:
    url: "http://{{ postal_web_addrs | first }}:{{ postal_web_port }}/login"
    headers:
      Host: "{{ postal_web_hostname }}"
    status_code: 200
  register: postal_web_login
  until: postal_web_login is succeeded
  retries: 10
  delay: 3
  changed_when: false

- name: Record the schema version for the report
  ansible.builtin.set_fact:
    stand_schema_migrations: "{{ schema_check.query_result[0][0].n }}"
    cacheable: true
