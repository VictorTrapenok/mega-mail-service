---
# Внутренний авторитативный DNS для зоны .test.
#
# Он обязателен, а не желателен: app/lib/dns_resolver.rb обращается через
# Resolv::DNS и никогда не читает /etc/hosts, а MX-записи в hosts-файле
# не существует как типа. Неотвеченный MX-запрос стоит около 10 секунд
# и поднимает исключение (raise_timeout_errors: true), превращаясь в SoftFail —
# то есть отсутствие DNS выглядит как медленный Postal.


# Домены назначения — поддомены основной зоны, поэтому одна зона покрывает всё.
# Отвечает плагин template по регулярному выражению: держать 1000 записей
# в файле незачем.
test_dns_destination_prefix: "d"

# Куда указывают MX доменов назначения. Несколько sink'ов получают
# одинаковый приоритет: DNSResolver#mx рандомизирует равноприоритетные записи,
# так что нагрузка расходится сама, без балансировщика.
test_dns_mx_priority: 10

# Файл resolv.conf, который подсовывается контейнерам Postal через
# DNS_RESOLV_CONF_PATH. Хостовой /etc/resolv.conf не трогаем: при
# network_mode: host Postal унаследовал бы systemd-resolved на 127.0.0.53.
