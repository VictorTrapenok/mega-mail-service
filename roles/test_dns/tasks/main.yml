---
- name: Create the CoreDNS directory
  ansible.builtin.file:
    path: "{{ test_dns_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the Corefile
  ansible.builtin.template:
    src: Corefile.j2
    dest: "{{ test_dns_dir }}/Corefile"
    owner: root
    group: root
    mode: "0644"
  notify: Restart CoreDNS

- name: Deploy the {{ postal_test_domain }} zone
  ansible.builtin.template:
    src: zone.j2
    dest: "{{ test_dns_dir }}/{{ postal_test_domain }}.zone"
    owner: root
    group: root
    mode: "0644"
  notify: Restart CoreDNS

- name: Deploy the CoreDNS compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ test_dns_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart CoreDNS

- name: Start CoreDNS
  community.docker.docker_compose_v2:
    project_src: "{{ test_dns_dir }}"
    state: present
    wait: true

- name: Apply the deferred CoreDNS restart
  ansible.builtin.meta: flush_handlers

- name: Check that a destination domain MX resolves authoritatively
  ansible.builtin.command:
    argv:
      - dig
      - "@{{ test_dns_addr }}"
      - "+short"
      - MX
      - "{{ test_dns_destination_prefix }}0001.{{ postal_test_domain }}"
  register: dns_check_mx
  changed_when: false
  failed_when: dns_check_mx.stdout | trim == ""

# External domains must not resolve at all: this is a separate containment line
# that fires before the nftables rules and does not depend on them.
- name: Check that external domains do not resolve
  ansible.builtin.command:
    argv: [dig, "@{{ test_dns_addr }}", "+short", MX, "gmail.com"]
  register: dns_check_external
  changed_when: false
  failed_when: dns_check_external.stdout | trim != ""
