---
# A single measured run: samplers -> warm-up -> load -> drain.
#
# This role is NON-idempotent by design. The comparison protocol requires an identical
# starting state before every run, so reset.yml is executed separately and before it.
#
# The warm-up and the working phase are TWO separate generator invocations. Otherwise the final
# k6 summary would contain the sum of both phases, while the measurement window and the
# reconciliation query would cover only the second, and "accepted" would never match "delivered".

- name: Warm-up
  ansible.builtin.command:
    argv: >-
      {{ bench_loadgen_argv + bench_loadgen_cpuset_argv
         + ['-e', 'BENCH_PHASE=warmup',
            '-e', 'BENCH_DURATION=' ~ bench_warmup_s ~ 's',
            loadgen_image_ref, 'run', '/scripts/send.js'] }}
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
  changed_when: true

# --- Start of the measurement window --------------------------------------
# The time is taken from a live clock on the main DB host rather than from ansible_date_time:
# that fact is captured once during fact gathering and does not change during the play,
# which would make the window negative and the reconciliation query find
# no rows at all. It is the clock of exactly the host whose timestamps are filtered.
- name: Record the start of the measurement window
  ansible.builtin.command:
    argv: [date, -u, +%s]
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  changed_when: false
  register: clock_start

- name: Read the sink delivery counter before the window
  ansible.builtin.shell:
    cmd: "grep -c 'status=sent ({{ postfix_sink_discard_token }})' {{ postfix_sink_log }} || true"
  args:
    executable: /bin/bash
  delegate_to: "{{ item }}"
  loop: "{{ groups['postfix_sinks'] }}"
  run_once: true
  changed_when: false
  register: sink_before

- name: Pin the start of the window
  ansible.builtin.set_fact:
    bench_window_start: "{{ clock_start.stdout | trim }}"
    bench_sink_before: "{{ sink_before.results | map(attribute='stdout') | map('trim') | map('int') | sum }}"
  run_once: true

- name: Working load
  ansible.builtin.command:
    argv: >-
      {{ bench_loadgen_argv + bench_loadgen_cpuset_argv
         + ['-e', 'BENCH_PHASE=steady',
            '-e', 'BENCH_DURATION=' ~ bench_duration_s ~ 's',
            loadgen_image_ref, 'run', '/scripts/send.js'] }}
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
  changed_when: true
  register: loadgen_result

- name: Record the end of the measurement window
  ansible.builtin.command:
    argv: [date, -u, +%s]
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  changed_when: false
  register: clock_end

- name: Read the sink delivery counter after the window
  ansible.builtin.shell:
    cmd: "grep -c 'status=sent ({{ postfix_sink_discard_token }})' {{ postfix_sink_log }} || true"
  args:
    executable: /bin/bash
  delegate_to: "{{ item }}"
  loop: "{{ groups['postfix_sinks'] }}"
  run_once: true
  changed_when: false
  register: sink_after_load

- name: Pin the end of the window
  ansible.builtin.set_fact:
    bench_window_end: "{{ clock_end.stdout | trim }}"
  run_once: true

# Drain: ingress is stopped (the generator has finished), we wait for the queue to empty.
# The drain time is a result in its own right: it shows whether
# delivery keeps up with ingress.
- name: Wait for the queue to empty
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT COUNT(*) AS n FROM queued_messages"
  register: drain_check
  until: (drain_check.query_result[0][0].n | int) == 0
  retries: "{{ ((bench_drain_timeout_s | int) / 10) | int }}"
  delay: 10
  # An unfinished drain is a RESULT, not a failure: it means that
  # delivery does not keep up with ingress. So we neither fail the run nor
  # present it as successful: the fact goes into the report as a separate line.
  failed_when: false
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['postal_main_db'] | first }}"

- name: Record the end of the drain
  ansible.builtin.command:
    argv: [date, -u, +%s]
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  changed_when: false
  register: clock_drain

- name: Read the sink delivery counter after the drain
  ansible.builtin.shell:
    cmd: "grep -c 'status=sent ({{ postfix_sink_discard_token }})' {{ postfix_sink_log }} || true"
  args:
    executable: /bin/bash
  delegate_to: "{{ item }}"
  loop: "{{ groups['postfix_sinks'] }}"
  run_once: true
  changed_when: false
  register: sink_after_drain

- name: Pin the run results
  ansible.builtin.set_fact:
    bench_drain_end: "{{ clock_drain.stdout | trim }}"
    bench_drained: "{{ (drain_check.query_result[0][0].n | int) == 0 }}"
    bench_queue_left_after_drain: "{{ drain_check.query_result[0][0].n | int }}"
    # Delivery is counted over the WINDOW rather than over the whole log: otherwise it would
    # include the warm-up and leftovers from previous runs, and the independent delivery check
    # would carry a built-in discrepancy against the windowed selection from the DB.
    bench_delivered: >-
      {{ (sink_after_drain.results | map(attribute='stdout')
          | map('trim') | map('int') | sum) - (bench_sink_before | int) }}
    bench_delivered_at_window_end: >-
      {{ (sink_after_load.results | map(attribute='stdout')
          | map('trim') | map('int') | sum) - (bench_sink_before | int) }}
  run_once: true

- name: Fetch the generator summaries
  ansible.builtin.fetch:
    src: "{{ loadgen_results_dir }}/{{ bench_run_id }}-{{ item }}-summary.json"
    dest: "{{ bench_reports_dir }}/{{ bench_run_id }}/"
    flat: false
    fail_on_missing: false
  loop: [warmup, steady]
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
