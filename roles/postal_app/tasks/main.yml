---
- name: Create the Postal directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ postal_dir }}"
    - "{{ postal_config_dir }}"
    - "{{ postal_dir }}/scripts"

# With network_mode: host, Postal would inherit the host's /etc/resolv.conf,
# i.e. systemd-resolved on 127.0.0.53, which forwards MX queries to the outside.
# We do not touch host name resolution — we hand it a separate file instead.
- name: Prepare resolv.conf for the Postal containers
  ansible.builtin.copy:
    dest: "{{ test_dns_resolv_conf }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible managed
      nameserver {{ test_dns_addr }}
      options timeout:{{ postal_dns.timeout }} attempts:2

# The signing key is the only thing left in /config: everything else
# is set through environment variables, which Konfig reads before YAML.
- name: Generate the signing key
  ansible.builtin.command:
    argv: [openssl, genrsa, "-out", "{{ postal_config_dir }}/signing.key", "{{ postal_signing_key_bits }}"]
    creates: "{{ postal_config_dir }}/signing.key"

- name: Set the permissions on the signing key
  ansible.builtin.file:
    path: "{{ postal_config_dir }}/signing.key"
    # UID 999 is the postal user inside the image.
    owner: "999"
    mode: "0600"

- name: Deploy the Postal compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postal_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Postal

- name: Start Postal
  community.docker.docker_compose_v2:
    project_src: "{{ postal_dir }}"
    state: present
    wait: true
    wait_timeout: 180
    # The number of ingress and worker replicas is set by the inventory, and when it is
    # reduced the surplus containers would otherwise keep running: they would go on holding
    # their ports and draining the queue, while the report would print a configuration
    # that no longer exists on the host.
    remove_orphans: true

- name: Apply the deferred Postal restart
  ansible.builtin.meta: flush_handlers

# When the port is taken, the health server catches EADDRINUSE and merely writes
# to the log, so "the service started" and "the service is observable" are different facts.
- name: Check that all worker health endpoints respond
  ansible.builtin.uri:
    url: "http://{{ svc_ip }}:{{ postal_worker_health_port_base + item }}/health"
    status_code: 200
  loop: "{{ range(postal_worker_replicas | int) | list }}"
  when: inventory_hostname in (groups['postal_workers'] | default([]))
  retries: 10
  delay: 3
  register: worker_health
  until: worker_health is succeeded
