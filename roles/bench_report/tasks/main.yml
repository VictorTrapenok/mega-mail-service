---
# Building the run report. Runs after bench_run and reads what it left behind.
#
# Delivery is NOT recomputed here from scratch: bench_run read the sink counters
# at the window boundaries, and the difference already sits in bench_delivered. Recounting
# over the whole log would include the warm-up and leftovers from previous runs.

- name: Reconcile by state buckets
  community.mysql.mysql_query:
    login_host: "{{ postal_message_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_seed.message_db_name }}"
    # messages.timestamp is a decimal(18,6) holding a Unix epoch, not a DATETIME,
    # so the window boundaries are compared against numbers rather than NOW().
    query: >-
      SELECT status, COUNT(*) AS n FROM messages
      WHERE scope = 'outgoing'
        AND timestamp >= {{ bench_window_start }}
        AND timestamp <  {{ bench_window_end }}
      GROUP BY status
  register: reconcile_raw
  changed_when: false
  delegate_to: "{{ groups['postal_main_db'] | first }}"

- name: Collect the buckets into a dictionary
  ansible.builtin.set_fact:
    bench_buckets: >-
      {{ dict(reconcile_raw.query_result[0] | map(attribute='status')
              | zip(reconcile_raw.query_result[0] | map(attribute='n'))) }}

- name: Count the queue remainder
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    # SUM returns a DECIMAL, and the module cannot serialise Decimal when
    # no_log is enabled, failing with "Value of unknown type". While the queue
    # stayed empty, SUM returned NULL and the error did not show up.
    # Casting to SIGNED removes it at the source.
    query: >-
      SELECT
        COUNT(*) AS total,
        CAST(SUM(CASE WHEN locked_at IS NOT NULL THEN 1 ELSE 0 END) AS SIGNED) AS in_flight
      FROM queued_messages
  register: queue_left
  changed_when: false
  delegate_to: "{{ groups['postal_main_db'] | first }}"

# The worker log reading window is computed rather than taken from the configuration: the sum
# of the configured timeouts would also cover the previous run, and its
# "removing queued message" lines would look like a finding of the current one. The count runs
# from the start of the warm-up, because a removal could have happened there too.
- name: Take the current time for the log reading window
  ansible.builtin.command:
    argv: [date, -u, +%s]
  delegate_to: "{{ groups['postal_workers'] | first }}"
  changed_when: false
  register: report_clock

- name: Compute the worker log reading window
  ansible.builtin.set_fact:
    bench_run_seconds: >-
      {{ (report_clock.stdout | trim | int) - (bench_window_start | int)
         + (0 if bench_report_kind == 'drain' else (bench_warmup_s | int)) + 60 }}

# The worker DESTROYS messages with a stale lock instead of reopening them.
# If that happened, the reconciliation will not add up, and the cause must be named
# rather than written off as measurement error.
- name: Check that no messages were removed silently
  ansible.builtin.shell:
    cmd: >-
      docker compose -f {{ postal_dir }}/docker-compose.yml logs --no-color --since {{ bench_run_seconds }}s
      2>/dev/null | grep -c 'removing queued message' || true
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['postal_workers'] | first }}"
  register: silent_removals
  changed_when: false

# The counter is read from ALL hosts with containment and summed.
# Reading from a single host would mean a leak from any other one stays invisible.
- name: Read the leak attempt counters
  ansible.builtin.shell:
    cmd: >-
      nft -j list counter inet mailguard smtp_escape_attempts
      | python3 -c "import sys,json; print(json.load(sys.stdin)['nftables'][1]['counter']['packets'])"
  args:
    executable: /bin/bash
  delegate_to: "{{ item }}"
  loop: "{{ containment_hosts }}"
  register: escape_counters
  changed_when: false
  # We do not fail report collection: an unreadable counter is a fact that must
  # reach the report as "containment not confirmed" rather than lose the whole run.
  failed_when: false

- name: Aggregate the leak counters
  ansible.builtin.set_fact:
    # An unreadable counter is NOT a zero. An empty value in the report would look
    # like "nothing escaped", so unreadability is flagged explicitly.
    bench_escape_readable: "{{ escape_counters.results | rejectattr('rc', 'equalto', 0) | list | length == 0 }}"
    bench_escape_packets: >-
      {{ escape_counters.results | selectattr('rc', 'equalto', 0)
         | map(attribute='stdout') | map('trim') | map('int') | sum }}

- name: Read the digest of the actually running Postal image
  ansible.builtin.shell:
    cmd: >-
      docker inspect --format '{% raw %}{{index .Config.Image}}{% endraw %}'
      $(docker compose -f {{ postal_dir }}/docker-compose.yml ps -q worker1) 2>/dev/null || echo unknown
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['postal_workers'] | first }}"
  register: running_image
  changed_when: false

# A locally built image is tagged by the digest of its own source, so the tag above
# already identifies the code. This reads the same digest back out of a LABEL on the
# running container, which is the only value that cannot be produced by a stale tag,
# a compose file that did not change or a container that did not get recreated.
# Empty output means the running image was not built by this bench.
- name: Read the source digest baked into the running Postal image
  ansible.builtin.shell:
    cmd: >-
      docker inspect
      --format '{% raw %}{{index .Config.Labels "bench.source.tree"}}{% endraw %}'
      $(docker compose -f {{ postal_dir }}/docker-compose.yml ps -q worker1) 2>/dev/null || echo ''
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['postal_workers'] | first }}"
  register: running_source_digest
  changed_when: false

# The pool state decides how the per-address figures are read, so it is taken from the running
# container rather than from group_vars. They disagreed on the first throttled run: the report
# said pools were disabled while six outbound addresses were plainly at work in the refusal
# breakdown. A variable describes what someone meant to deploy; this describes what ran.
- name: Read whether the running Postal actually uses IP pools
  ansible.builtin.shell:
    cmd: >-
      docker inspect --format '{% raw %}{{range .Config.Env}}{{println .}}{{end}}{% endraw %}'
      $(docker compose -f {{ postal_dir }}/docker-compose.yml ps -q worker1) 2>/dev/null
      | grep -oP '(?<=^POSTAL_USE_IP_POOLS=).*' || echo unknown
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['postal_workers'] | first }}"
  register: running_ip_pools
  changed_when: false

- name: Fetch the summary of the measured generator phase
  ansible.builtin.slurp:
    src: "{{ loadgen_results_dir }}/{{ bench_run_id }}-{{ bench_report_loadgen_phase }}-summary.json"
  delegate_to: "{{ groups['load_generators'] | first }}"
  register: loadgen_summary_raw

- name: Parse the generator summary
  ansible.builtin.set_fact:
    loadgen_summary: "{{ loadgen_summary_raw.content | b64decode | from_json }}"

# The final numbers are computed here rather than only in the template: the reconciliation
# tolerance check refers to them, and a report nobody verifies is just
# a nicely formatted assumption.
#
# k6 metrics are accessed with index notation only: in Jinja, `.values`
# resolves to the dict.values method rather than to the "values" key.
- name: Aggregate the run results
  ansible.builtin.set_fact:
    bench_accepted: "{{ loadgen_summary.metrics['postal_accepted_recipients']['values']['count'] | default(0) | int }}"
    bench_rejected: "{{ loadgen_summary.metrics['postal_rejected_recipients']['values']['count'] | default(0) | int }}"
    bench_dropped: "{{ loadgen_summary.metrics['dropped_iterations']['values']['count'] | default(0) | int }}"
    bench_queued_now: "{{ queue_left.query_result[0][0].total | default(0) | int }}"
    bench_in_flight: "{{ queue_left.query_result[0][0].in_flight | default(0) | int }}"
  run_once: true

# A deferred message keeps its queue row AND carries a status, so it lands on both sides of
# the identity unless its status is excluded. Which statuses those are, and why the set is
# enumerated rather than derived, is in bench_report_in_queue_statuses in defaults/main.yml.
- name: Compute the reconciliation discrepancy
  ansible.builtin.set_fact:
    bench_pending: "{{ bench_buckets.Pending | default(0) | int }}"
    # Deferred messages, whatever put them there. Reported separately because under a
    # throttling sink profile this is the bucket that carries the whole effect.
    bench_deferred: >-
      {{ (bench_buckets.SoftFail | default(0) | int) + (bench_buckets.Error | default(0) | int) }}
    bench_terminal: >-
      {{ bench_buckets | dict2items | rejectattr('key', 'in', bench_report_in_queue_statuses)
         | map(attribute='value') | map('int') | sum }}
    # In an ingress run the queue remainder must not be taken over the whole table: the workers
    # are stopped, so it also holds the warm-up messages, whereas what was accepted
    # is counted over the window only. The identity here is different — what was accepted must
    # match the queue increment over the same window.
    bench_unaccounted: >-
      {{ (bench_accepted | int)
         - (bench_buckets | dict2items | rejectattr('key', 'in', bench_report_in_queue_statuses)
            | map(attribute='value') | map('int') | sum)
         - (((bench_ingress_queue_after | int) - (bench_ingress_queue_before | int))
            if bench_report_kind == 'ingress' else (bench_queued_now | int)) }}
  run_once: true

# An unknown status is treated as terminal by the sum above. If a future Postal version adds
# one that keeps its queue row, the identity would quietly double-count it and the run would
# be blamed on lost messages. Failing loudly here costs one line and names the real cause.
- name: Check that every status is classified
  ansible.builtin.assert:
    that:
      - (bench_buckets | list) | difference(bench_report_known_statuses) | length == 0
    fail_msg: >-
      Unknown message status
      {{ (bench_buckets | list) | difference(bench_report_known_statuses) | join(', ') }}.
      The reconciliation assumes anything unlisted is terminal and its queue row is gone;
      if that is wrong for this status, the identity double-counts it. Classify it in
      bench_report_in_queue_statuses before trusting this run.
  run_once: true

- name: Create the reports directory
  ansible.builtin.file:
    path: "{{ bench_reports_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Build the report
  ansible.builtin.template:
    src: report.md.j2
    dest: "{{ bench_reports_dir }}/{{ bench_run_id }}.md"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true

# A run whose reconciliation did not add up is not a result: a discrepancy
# means either lost messages or lost log lines. The report nevertheless stays
# on disk — it is what the cause is investigated from.
- name: Check that the reconciliation adds up
  ansible.builtin.assert:
    that:
      - bench_accepted | int > 0
      - (bench_unaccounted | int | abs) <= (bench_accepted | int) * (bench_reconcile_tolerance | float)
    fail_msg: >-
      The reconciliation did not add up: {{ bench_accepted }} accepted,
      {{ bench_unaccounted }} unaccounted for against a tolerance of
      {{ (bench_reconcile_tolerance | float) * 100 }} %.
      Details in {{ bench_reports_dir }}/{{ bench_run_id }}.md
    success_msg: "The reconciliation adds up, discrepancy {{ bench_unaccounted }} out of {{ bench_accepted }}."
  run_once: true

- name: Show the path to the report
  ansible.builtin.debug:
    msg: "Report: {{ bench_reports_dir }}/{{ bench_run_id }}.md"
  run_once: true
