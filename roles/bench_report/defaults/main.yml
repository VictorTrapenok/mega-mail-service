---
# Вид прогона, о котором собирается отчёт:
#
#   combined — приём и разбор очереди одновременно (playbooks/benchmark.yml);
#   ingress  — только приём, воркеры остановлены (playbooks/ingress.yml);
#   drain    — только разбор заранее набитой очереди (playbooks/drain.yml).
#
# Раздельные виды существуют потому, что в комбинированном прогоне приём
# и доставка конкурируют за одни ядра и одну БД, и одно число на выходе
# не позволяет сказать, какая из двух половин не дотягивает до цели.
bench_report_kind: combined

# Фаза генератора, чью сводку берём за результат. В прогоне дренажа рабочей
# фазы нет вовсе: письма создаются набивкой, а измеряется уже разбор очереди.
bench_report_loadgen_phase: "{{ 'prefill' if bench_report_kind == 'drain' else 'steady' }}"
