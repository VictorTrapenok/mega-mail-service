---
# Filling the queue before the drain measurement.
#
# Messages are created the normal way — through the HTTP API with the workers stopped,
# not by inserting rows into the DB. Raw SQL would have to reproduce by hand a row
# in messages, two longblob rows of the per-day raw table and a queue row
# with all its associations; any inaccuracy there would look like a measurement result.
# The price of honesty is time: the fill proceeds at the ingress rate.
#
# The role is NON-idempotent by design: every call adds messages to the queue.

# The timestamp is needed as the lower bound of the reconciliation window: messages are created
# here, not during the drain, so a selection by the drain time would find no
# rows in messages, and the reconciliation would show a complete shortfall.
- name: Record the start of the fill
  ansible.builtin.command:
    argv: [date, -u, +%s]
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  changed_when: false
  register: prefill_clock_start

- name: Pin the start of the fill
  ansible.builtin.set_fact:
    bench_prefill_start: "{{ prefill_clock_start.stdout | trim }}"
  run_once: true

- name: Fill the queue with messages
  ansible.builtin.command:
    argv: >-
      {{ bench_loadgen_argv + bench_loadgen_cpuset_argv
         + ['-e', 'BENCH_PHASE=prefill',
            '-e', 'BENCH_MODE=burst',
            '-e', 'BENCH_ITERATIONS=' ~ bench_prefill_recipients,
            '-e', 'BENCH_BURST_VUS=' ~ bench_prefill_burst_vus,
            '-e', 'BENCH_DURATION=' ~ bench_prefill_timeout_s ~ 's',
            loadgen_image_ref, 'run', '/scripts/send.js'] }}
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
  changed_when: true

- name: Measure the actual queue length
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT COUNT(*) AS n FROM queued_messages"
  register: bench_prefill_actual
  changed_when: false
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true

# A discrepancy larger than the tolerance means that some messages never reached the queue:
# either ingress was rejecting them, or a worker was running after all and managed to drain them.
# Either way the drain measurement becomes meaningless, because the denominator
# of the rate is unknown.
- name: Check that the queue was filled as expected
  ansible.builtin.assert:
    that:
      - >-
        ((bench_prefill_actual.query_result[0][0].n | int)
         - (bench_prefill_recipients | int)) | abs
        <= (bench_prefill_recipients | int) * (bench_reconcile_tolerance | float)
    fail_msg: >-
      The queue holds {{ bench_prefill_actual.query_result[0][0].n }} rows instead of
      {{ bench_prefill_recipients }}. The fill failed: check that the workers are
      stopped and that ingress was not rejecting messages.
  run_once: true

- name: Find the threshold identifier for the deferred share
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: >-
      SELECT id FROM queued_messages ORDER BY id
       LIMIT 1 OFFSET {{ ((bench_prefill_actual.query_result[0][0].n | int)
                          * (bench_prefill_deferred_share | float)) | round | int - 1 }}
  register: bench_deferred_threshold
  changed_when: false
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  when: (bench_prefill_deferred_share | float) > 0

# The oldest rows by primary key are deferred: the claim query walks
# it without ORDER BY and stops at the first suitable row, so
# the cost of the claim is determined by how many UNsuitable rows sit at the head of the
# table. Deferring random rows would spread them evenly
# and not reproduce queue degeneration at all.
- name: Move the old rows to deferred
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: >-
      UPDATE queued_messages
         SET retry_after = UTC_TIMESTAMP() + INTERVAL {{ bench_prefill_deferred_delay_s | int }} SECOND
       WHERE id <= {{ bench_deferred_threshold.query_result[0][0].id | int }}
  changed_when: true
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  when: (bench_prefill_deferred_share | float) > 0

- name: Record the queue composition before the drain
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: >-
      SELECT COUNT(*) AS total,
             CAST(SUM(retry_after IS NULL
                 OR retry_after < UTC_TIMESTAMP() - INTERVAL 30 SECOND) AS SIGNED) AS ready,
             CAST(SUM(retry_after IS NOT NULL
                 AND retry_after >= UTC_TIMESTAMP() - INTERVAL 30 SECOND) AS SIGNED) AS deferred
        FROM queued_messages
  register: bench_prefill_composition
  changed_when: false
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true

- name: Distribute the queue composition as a fact
  ansible.builtin.set_fact:
    bench_queue_total: "{{ bench_prefill_composition.query_result[0][0].total | int }}"
    bench_queue_ready: "{{ bench_prefill_composition.query_result[0][0].ready | int }}"
    bench_queue_deferred: "{{ bench_prefill_composition.query_result[0][0].deferred | int }}"
  run_once: true

- name: Fetch the fill summary
  ansible.builtin.fetch:
    src: "{{ loadgen_results_dir }}/{{ bench_run_id }}-prefill-summary.json"
    dest: "{{ bench_reports_dir }}/{{ bench_run_id }}/"
    flat: false
    fail_on_missing: false
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
