---
# Docker Engine + compose plugin.

docker_apt_repo_url: "https://download.docker.com/linux/ubuntu"
docker_apt_gpg_key: "https://download.docker.com/linux/ubuntu/gpg"
docker_apt_channel: "stable"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Version pinning is disabled by default so that the first deployment
# does not fail because a version disappeared from the repository.
#
# It IS worth enabling as soon as the bench works: Compose 5.2.0 replaced the state
# reconciliation algorithm, 5.5.0 warns about a one-off container recreation after
# an upgrade, and community.docker parses the output of the Compose CLI, whose format
# is documented as unstable. An upgrade in the middle of a series of runs
# will recreate the containers and reset the counters.
#
# The actually installed versions end up in the run report regardless.
docker_pin_versions: false
docker_pinned_versions:
  docker-ce: "5:29.7.2-1~ubuntu.24.04~noble"
  docker-ce-cli: "5:29.7.2-1~ubuntu.24.04~noble"
  containerd.io: "2.3.4-1~ubuntu.24.04~noble"
  docker-buildx-plugin: "0.36.1-1~ubuntu.24.04~noble"
  docker-compose-plugin: "5.5.0-1~ubuntu.24.04~noble"

# The json-file driver writes synchronously and on a loaded sink becomes
# a bottleneck before Postfix does. We limit both the size and the rotation.
docker_log_driver: "local"
docker_log_max_size: "64m"
docker_log_max_file: "3"
