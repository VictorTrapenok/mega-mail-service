---
# Measuring ONLY the ingress rate.
#
# The delivery workers are stopped by the calling playbook, so during the run the queue
# only grows. That is the whole point of the measurement: ingress and queue draining
# compete for the same cores and the same DB, and in a combined run it is impossible
# to tell which of the two halves is falling short of the target.
#
# A side benefit is a queue filled the normal way: it remains the input
# for the drain measurement.

- name: Warm-up
  ansible.builtin.command:
    argv: >-
      {{ bench_loadgen_argv + bench_loadgen_cpuset_argv
         + ['-e', 'BENCH_PHASE=warmup',
            '-e', 'BENCH_DURATION=' ~ bench_warmup_s ~ 's',
            loadgen_image_ref, 'run', '/scripts/send.js'] }}
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
  changed_when: true

# The measurement is taken AFTER the warm-up: the warm-up messages also stayed in the queue,
# because the workers are stopped, and counting from the state before the warm-up would
# overstate the increment by its whole duration.
- name: Measure the queue length before the window
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT COUNT(*) AS n FROM queued_messages"
  register: ingress_queue_before
  changed_when: false
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true

# The time is taken from a live clock on the main DB host rather than from ansible_date_time:
# that fact is captured once during fact gathering and does not change during the play.
- name: Record the start of the window
  ansible.builtin.command:
    argv: [date, -u, +%s]
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  changed_when: false
  register: ingress_clock_start

- name: Working load
  ansible.builtin.command:
    argv: >-
      {{ bench_loadgen_argv + bench_loadgen_cpuset_argv
         + ['-e', 'BENCH_PHASE=steady',
            '-e', 'BENCH_DURATION=' ~ bench_duration_s ~ 's',
            loadgen_image_ref, 'run', '/scripts/send.js'] }}
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
  changed_when: true

- name: Record the end of the window
  ansible.builtin.command:
    argv: [date, -u, +%s]
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true
  changed_when: false
  register: ingress_clock_end

- name: Measure the queue length after the load
  community.mysql.mysql_query:
    login_host: "{{ postal_main_db_addr }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ mariadb_postal_user }}"
    login_password: "{{ mariadb_postal_password }}"
    login_db: "{{ postal_main_db_name }}"
    query: "SELECT COUNT(*) AS n FROM queued_messages"
  register: ingress_queue_after
  changed_when: false
  delegate_to: "{{ groups['postal_main_db'] | first }}"
  run_once: true

- name: Pin the ingress results
  ansible.builtin.set_fact:
    bench_ingress_window_start: "{{ ingress_clock_start.stdout | trim }}"
    bench_ingress_window_end: "{{ ingress_clock_end.stdout | trim }}"
    bench_ingress_queue_before: "{{ ingress_queue_before.query_result[0][0].n | int }}"
    bench_ingress_queue_after: "{{ ingress_queue_after.query_result[0][0].n | int }}"
  run_once: true

- name: Fetch the generator summaries
  ansible.builtin.fetch:
    src: "{{ loadgen_results_dir }}/{{ bench_run_id }}-{{ item }}-summary.json"
    dest: "{{ bench_reports_dir }}/{{ bench_run_id }}/"
    flat: false
    fail_on_missing: false
  loop: [warmup, steady]
  delegate_to: "{{ groups['load_generators'] | first }}"
  run_once: true
