---

# Параметры MariaDB фиксируются явно и вычитываются обратно после старта.
# Причина: дефолтный innodb_buffer_pool_size — 128 МБ, и на очереди в несколько
# миллионов строк стенд измеряет диск, а не код. Все сборки сойдутся на одном
# и том же числе, и сравнение не даст сигнала.
mariadb_pinned:
  innodb_buffer_pool_size: "4G"
  # Документация Postal требует не меньше десятикратного размера самого
  # большого письма: 250 МБ на 25 МБ письма.
  innodb_log_file_size: "512M"
  innodb_flush_log_at_trx_commit: "1"
  innodb_io_capacity: "2000"
  innodb_io_capacity_max: "4000"
  innodb_read_io_threads: "8"
  innodb_write_io_threads: "8"
  # Должно с запасом перекрывать replicas x threads x pool_size,
  # плюс подключения сэмплера и сверки.
  max_connections: "500"
  transaction_isolation: "READ-COMMITTED"

# Бинлог на стенде не нужен и удваивает запись на диск.
mariadb_binlog_enabled: false

# performance_schema включается только диагностическим прогоном:
# consumers задаются исключительно опциями старта, не через SET.
mariadb_perf_schema: false
