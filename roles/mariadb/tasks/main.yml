---
- name: Create the MariaDB directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ mariadb_dir }}"
    - "{{ mariadb_dir }}/conf.d"

- name: Deploy my.cnf
  ansible.builtin.template:
    src: my.cnf.j2
    dest: "{{ mariadb_dir }}/conf.d/99-bench.cnf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MariaDB

- name: Deploy the MariaDB compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mariadb_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MariaDB

- name: Start MariaDB
  community.docker.docker_compose_v2:
    project_src: "{{ mariadb_dir }}"
    state: present
    wait: true

- name: Apply the deferred MariaDB restart
  ansible.builtin.meta: flush_handlers

- name: Wait for MariaDB after a possible restart
  ansible.builtin.wait_for:
    host: "{{ svc_ip }}"
    port: "{{ mariadb_port }}"
    state: started
    timeout: 120

# Postal connects to the message DB as the same user and creates the databases
# on the fly (Server after_create -> provisioner.provision), so it needs
# privileges on the whole prefix, not only on the main database.
- name: Grant privileges on the message DB databases
  community.mysql.mysql_query:
    login_host: "{{ svc_ip }}"
    login_port: "{{ mariadb_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    query: >-
      GRANT ALL PRIVILEGES ON `{{ postal_message_db_prefix }}%`.*
      TO '{{ mariadb_postal_user }}'@'%'
  changed_when: true
  register: mariadb_message_db_grant
  until: mariadb_message_db_grant is succeeded
  retries: 12
  delay: 5

- name: Read the pinned MariaDB variables back
  community.mysql.mysql_query:
    login_host: "{{ svc_ip }}"
    login_port: "{{ mariadb_port }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    query: >-
      SELECT LOWER(VARIABLE_NAME) AS name, VARIABLE_VALUE AS value
      FROM information_schema.GLOBAL_VARIABLES
      WHERE LOWER(VARIABLE_NAME) IN
        ({{ mariadb_pinned.keys() | map('lower') | map('regex_replace', '^(.*)$', "'\\1'") | join(', ') }})
  register: mariadb_effective
  changed_when: false

# A value MariaDB did not accept silently stays at its default, and the whole run
# measures something other than what is written in the report. Hence we verify rather than hope.
- name: Store the effective values for the report
  ansible.builtin.set_fact:
    stand_mariadb_effective: >-
      {{ dict(mariadb_effective.query_result[0] | map(attribute='name')
              | zip(mariadb_effective.query_result[0] | map(attribute='value'))) }}
    cacheable: true
