---
- name: Create the generator directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0777"
  loop:
    - "{{ loadgen_dir }}"
    - "{{ loadgen_results_dir }}"

- name: Lay out the load script
  ansible.builtin.copy:
    src: send.js
    dest: "{{ loadgen_dir }}/send.js"
    owner: root
    group: root
    mode: "0644"

- name: Pull the generator image
  community.docker.docker_image_pull:
    name: "{{ loadgen_image_ref }}"
