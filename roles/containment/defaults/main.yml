---
# Изоляция стенда: запрет исходящего SMTP куда-либо, кроме хостов стенда.
#
# Это второй рубеж. Первый — внутренний DNS без forwarder'ов, из-за которого
# внешние домены просто не резолвятся. Третий — sink, в master.cf которого
# вообще нет служб доставки наружу. Каждый рубежа достаточно самого по себе;
# цена ошибки — репутация реальных отправляющих IP, поэтому их три.

containment_ports: [25, 465, 587]
containment_allowed_addrs: "{{ stand_cidr }}"

# reject, а не drop: молчаливое отбрасывание заставляет Postal ждать
# SMTP_CLIENT_OPEN_TIMEOUT (по умолчанию 30 с) на каждой попытке,
# и прогон превращается в измерение таймаутов.
containment_verdict: "reject with tcp reset"
