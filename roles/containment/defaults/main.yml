---
# Bench containment: outbound SMTP is forbidden anywhere except the bench hosts.
#
# This is the second line of defence. The first is the internal DNS without forwarders,
# because of which external domains simply do not resolve. The third is the sink, whose
# master.cf contains no outbound delivery services at all. Each line is sufficient on its own;
# the cost of a mistake is the reputation of real sending IPs, which is why there are three.

containment_ports: [25, 465, 587]
containment_allowed_addrs: "{{ stand_cidr }}"

# reject rather than drop: silently dropping makes Postal wait for
# SMTP_CLIENT_OPEN_TIMEOUT (30 s by default) on every attempt,
# and the run turns into a measurement of timeouts.
containment_verdict: "reject with tcp reset"
