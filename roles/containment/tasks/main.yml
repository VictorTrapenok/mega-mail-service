---
- name: Create the nftables rules directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Deliberately without validate: the atomic reload idiom (add + delete) does not
# pass `nft -c`, because in check mode the table is not actually created
# and there turns out to be nothing to delete. The rule itself is validated by the fact
# that the handler applies it, and it fails loudly if the rule is wrong.
- name: Install the SMTP containment rules
  ansible.builtin.template:
    src: mailguard.nft.j2
    dest: /etc/nftables.d/mailguard.nft
    owner: root
    group: root
    mode: "0755"
  notify: Reload mailguard

- name: Load mailguard at boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/mailguard.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Outbound SMTP containment for the Postal test bench
      After=network-pre.target
      Before=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/nftables.d/mailguard.nft

      [Install]
      WantedBy=multi-user.target
  notify: Reload the systemd unit files

- name: Apply the deferred handlers
  ansible.builtin.meta: flush_handlers

- name: Enable mailguard
  ansible.builtin.systemd:
    name: mailguard
    state: started
    enabled: true
    daemon_reload: true

- name: Check that the leak counter exists
  ansible.builtin.command:
    argv: [/usr/sbin/nft, list, counter, inet, mailguard, smtp_escape_attempts]
  changed_when: false
