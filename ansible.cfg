[defaults]
# Playbooks live in playbooks/, so roles_path is set explicitly —
# otherwise Ansible would look for roles in playbooks/roles/.
roles_path      = roles
collections_path = collections
inventory       = inventories/single-host
stdout_callback = default
callback_result_format = yaml
host_key_checking = False
interpreter_python = auto_silent
forks           = 20
local_tmp       = .ansible_facts/tmp

# The fact cache is required because component plays (for example, postal_workers only)
# access hostvars of other hosts. Without the cache the facts of those hosts are empty.
gathering       = smart
fact_caching    = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 7200

[ssh_connection]
pipelining = True
control_path_dir = .ansible_facts/cp
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey
