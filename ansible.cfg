[defaults]
# Плейбуки лежат в playbooks/, поэтому roles_path задаём явно —
# иначе Ansible искал бы роли в playbooks/roles/.
roles_path      = roles
inventory       = inventories/single-host
stdout_callback = yaml
host_key_checking = False
interpreter_python = auto_silent
forks           = 20

# Кэш фактов нужен, потому что компонентные плеи (например, только postal_workers)
# обращаются к hostvars чужих хостов. Без кэша факты этих хостов пусты.
gathering       = smart
fact_caching    = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 7200

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey
