---
# Измерительный inventory: минимум две машины.
#
#   sut  — MariaDB + Postal (web/smtp/worker). Только система под тестом.
#   aux  — DNS + Postfix sink + генератор нагрузки. Вспомогательная цепь.
#
# Разнесение обязательно: если генератор и sink стоят на том же железе,
# они конкурируют с SUT, и просадка Postal неотличима от их собственной.
#
# Расширяется добавлением строк: второй воркер — это ещё один хост
# в postal_workers, второй sink — ещё один в postfix_sinks. Роли не меняются.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: /home/elena/.ssh/id_rsa

    # Текущие test VPS: 2 vCPU / ~4 GB RAM. Глобальные дефолты рассчитаны
    # на более крупный измерительный хост; низкоуровневые лимиты хостов
    # переопределяются ниже в host vars, чтобы перекрыть group_vars/all.
    mariadb_pinned:
      innodb_buffer_pool_size: "1G"
      innodb_log_file_size: "256M"
      innodb_flush_log_at_trx_commit: "1"
      innodb_io_capacity: "1000"
      innodb_io_capacity_max: "2000"
      innodb_read_io_threads: "4"
      innodb_write_io_threads: "4"
      max_connections: "200"
      transaction_isolation: "READ-COMMITTED"
    postfix_sink_spool_tmpfs_size: "1g"

  hosts:
    sut:
      ansible_host: 188.245.52.20
      service_ip: 10.1.0.3
      mariadb_limits:
        cpus: "2.0"
        memory: "2g"
      postal_limits:
        web:
          cpus: "1.0"
          memory: "768m"
        smtp:
          cpus: "2.0"
          memory: "1g"
        worker:
          cpus: "2.0"
          memory: "1g"
      # Дополнительные исходящие адреса для IP pools. Раздаются хостером
      # и назначаются на интерфейс ролью postal_sending_ips.
      # Воркер перечисляет адреса своего netns через Socket.ip_address_list
      # и берёт только строки с совпадающим ip_address_id или с NULL,
      # поэтому адрес обязан физически присутствовать на этом хосте.
      # Второй и последующие адреса добавляются новыми элементами списка.
      postal_sending_ips:
        - ipv4: 10.1.0.3
          hostname: mta1.bench.test

    aux:
      ansible_host: 188.245.59.215
      service_ip: 10.1.0.2
      sink_limits:
        cpus: "2.0"
        memory: "2g"
      # Память генератора: k6 держит копию области модуля на каждый виртуальный
      # пользователь, а их число по закону Литтла равно скорости, умноженной
      # на латентность приёма. При латентности в единицы секунд это сотни VU,
      # и гигабайта не хватало — контейнер получал OOM (rc=137) вместо
      # результата. Лимит здесь потолок, а не резервирование: приёмнику
      # на этой же машине фактически нужны единицы мегабайт.
      loadgen_limits:
        cpus: "2.0"
        memory: "2g"

  children:
    postal_main_db:
      hosts:
        sut:
    postal_message_db:
      # По умолчанию та же машина. Разделение main и message DB —
      # это отдельный измеряемый эксперимент, а не базовая топология.
      hosts:
        sut:
    postal_admin:
      hosts:
        sut:
    postal_web:
      hosts:
        sut:
    postal_smtp:
      hosts:
        sut:
    postal_workers:
      hosts:
        sut:
    postal_load_balancers:
      # Только для HTTP API. Балансировка SMTP запрещена: HAProxy терминирует
      # TCP, и sink увидит его адрес вместо исходящего IP, привязанного Postal.
      hosts: {}
    test_dns:
      hosts:
        aux:
    postfix_sinks:
      # Второй sink добавляется только после доказательства,
      # что первый стал узким местом.
      hosts:
        aux:
    load_generators:
      hosts:
        aux:
    monitoring:
      hosts:
        aux:
