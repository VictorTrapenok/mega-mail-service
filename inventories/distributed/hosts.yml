---
# Measurement inventory: at least two machines.
#
#   sut  — MariaDB + Postal (web/smtp/worker). The system under test only.
#   aux  — DNS + Postfix sink + load generator. The auxiliary chain.
#
# Splitting them is mandatory: if the generator and the sink run on the same hardware,
# they compete with the SUT, and a drop in Postal is indistinguishable from their own.
#
# It is extended by adding lines: a second worker is one more host
# in postal_workers, a second sink one more in postfix_sinks. The roles do not change.

all:
  vars:
    ansible_user: root
    # Overridable because an absolute path into one developer's home directory is not a
    # setting, it is a machine that happens to have been used. Set BENCH_SSH_KEY to point
    # elsewhere; the default is what almost every workstation already has.
    ansible_ssh_private_key_file: "{{ lookup('env', 'BENCH_SSH_KEY') | default('~/.ssh/id_rsa', true) }}"

    # Current test VPS: 2 vCPU / ~4 GB RAM. The global defaults are sized
    # for a larger measurement host; the low-level host limits
    # are overridden below in host vars so they take precedence over group_vars/all.
    mariadb_pinned:
      innodb_buffer_pool_size: "1G"
      innodb_log_file_size: "256M"
      innodb_flush_log_at_trx_commit: "1"
      innodb_io_capacity: "1000"
      innodb_io_capacity_max: "2000"
      innodb_read_io_threads: "4"
      innodb_write_io_threads: "4"
      max_connections: "200"
      transaction_isolation: "READ-COMMITTED"
    postfix_sink_spool_tmpfs_size: "1g"

  # The addresses below belong to a throw-away lab built for this measurement and torn down
  # after it. They are kept rather than masked so the file is a working example rather than a
  # template with holes in it — reproducing the bench means replacing them and nothing else.
  hosts:
    sut:
      ansible_host: 188.245.52.20
      service_ip: 10.1.0.3
      # There is more than one ingress process because MRI Ruby has a GVL: a single
      # Puma process does not perform compute work on more than one core, and the
      # measurement showed exactly that — 92.5 % under a 1.0 CPU limit, about 15 recipients/s.
      # On a two-core machine two is the ceiling; on larger hardware
      # this value grows together with the core count.
      postal_web_replicas: 2
      # Two workers as well, for the same GVL reason: the compute part tops out at one core
      # per process. Measured: 20.8 recipients/s with one replica and 48.5 with two.
      # Note that ingress and draining do not fit on two cores simultaneously at the target
      # rate — 58/s of the full cycle needs about 3.5 cores. That is why the separate
      # playbooks measure the halves one at a time on this hardware.
      postal_worker_replicas: 2
      mariadb_limits:
        cpus: "2.0"
        memory: "2g"
      postal_limits:
        web:
          cpus: "1.0"
          memory: "768m"
        smtp:
          cpus: "2.0"
          memory: "1g"
        worker:
          cpus: "2.0"
          memory: "1g"
      # Outbound addresses of the IP pool. Six of them: the primary service address plus
      # five extra private addresses assigned to this server in the provider's console.
      # The list is the single source of truth — the postal_sending_ips role assigns these
      # addresses to the interface, the seeding creates the matching ip_addresses rows, and
      # the DNS zone publishes an A record per HELO name, so the database and the host
      # cannot drift apart.
      #
      # Extra addresses only route once the provider knows them: an address invented locally
      # answers ARP and goes nowhere, which stalls the share of the queue bound to it.
      postal_sending_ips:
        - ipv4: 10.1.0.3
          hostname: mta1.bench.test
        - ipv4: 10.1.0.14
          hostname: mta2.bench.test
        - ipv4: 10.1.0.15
          hostname: mta3.bench.test
        - ipv4: 10.1.0.16
          hostname: mta4.bench.test
        - ipv4: 10.1.0.17
          hostname: mta5.bench.test
        - ipv4: 10.1.0.18
          hostname: mta6.bench.test

    aux:
      ansible_host: 188.245.59.215
      service_ip: 10.1.0.2
      sink_limits:
        cpus: "2.0"
        memory: "2g"
      # Generator memory: k6 keeps a copy of the module scope per virtual
      # user, and by Little's law their number equals the rate multiplied
      # by the ingress latency. At a latency of a few seconds that is hundreds of VUs,
      # and one gigabyte was not enough — the container was OOM-killed (rc=137) instead of
      # producing a result. The limit here is a ceiling, not a reservation: the sink
      # on the same machine actually needs only a few megabytes.
      loadgen_limits:
        cpus: "2.0"
        memory: "2g"

  children:
    postal_main_db:
      hosts:
        sut:
    postal_message_db:
      # The same machine by default. Splitting the main and message DBs is
      # a separate measured experiment, not the baseline topology.
      hosts:
        sut:
    postal_admin:
      hosts:
        sut:
    postal_web:
      hosts:
        sut:
    postal_smtp:
      hosts:
        sut:
    postal_workers:
      hosts:
        sut:
    postal_load_balancers:
      # For the HTTP API only. SMTP load balancing is forbidden: HAProxy terminates
      # TCP, and the sink would see its address instead of the outbound IP bound by Postal.
      #
      # It runs on the auxiliary machine rather than on the system under test: there it
      # would steal cores from it, and a drop in ingress would be indistinguishable from the
      # balancer's own consumption.
      hosts:
        aux:
    test_dns:
      hosts:
        aux:
    postfix_sinks:
      # A second sink is added only after it has been proven
      # that the first one became the bottleneck.
      hosts:
        aux:
    load_generators:
      hosts:
        aux:
    monitoring:
      hosts:
        aux:
