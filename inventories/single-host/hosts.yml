---
# Отладочный inventory: все роли на одном сервере.
#
# Годится для проверки развёртывания, сидирования, DNS и сверки — то есть
# для всего, что дёшево ломается. Для сравнения сборок непригоден: генератор
# и sink конкурируют за те же ядра, что и SUT, поэтому preflight помечает
# прогоны как bench_run_class: debug, а отчёт это печатает.
#
# IP pools здесь недоступны (см. postal_use_ip_pools в group_vars).

all:
  hosts:
    stand:
      ansible_host: 127.0.0.1
      ansible_connection: local
      # service_ip обязателен: факты чужих хостов недоступны под --limit
      # и в компонентных плеях, поэтому на них полагаться нельзя.
      service_ip: 127.0.0.1

      # На одной машине разводим SUT, sink и генератор по ядрам.
      # cpuset, а не квота: CFS душит контейнер на границах 100-мс периодов,
      # показывая при этом среднюю загрузку заметно ниже 100 %.
      mariadb_cpuset: "0-1"
      postal_cpuset: "2-3"
      sink_cpuset: "4"
      loadgen_cpuset: "5"

  children:
    postal_main_db:
      hosts:
        stand:
    postal_message_db:
      hosts:
        stand:
    postal_admin:
      hosts:
        stand:
    postal_web:
      hosts:
        stand:
    postal_smtp:
      hosts:
        stand:
    postal_workers:
      hosts:
        stand:
    postal_load_balancers:
      hosts: {}
    test_dns:
      hosts:
        stand:
    postfix_sinks:
      hosts:
        stand:
    load_generators:
      hosts:
        stand:
    monitoring:
      hosts:
        stand:
