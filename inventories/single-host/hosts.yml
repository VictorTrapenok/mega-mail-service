---
# Debug inventory: all roles on a single server.
#
# Suitable for verifying deployment, seeding, DNS and reconciliation — that is,
# for everything that breaks cheaply. Unsuitable for comparing builds: the generator
# and the sink compete for the same cores as the SUT, so preflight marks such
# runs as bench_run_class: debug, and the report prints that.
#
# IP pools are unavailable here (see postal_use_ip_pools in group_vars).

all:
  hosts:
    stand:
      ansible_host: 127.0.0.1
      ansible_connection: local
      # service_ip is mandatory: facts of other hosts are unavailable under --limit
      # and in component plays, so they cannot be relied upon.
      service_ip: 127.0.0.1

      # On a single machine we spread the SUT, the sink and the generator across cores.
      # cpuset rather than a quota: CFS throttles the container at 100 ms period boundaries
      # while reporting an average load noticeably below 100 %.
      mariadb_cpuset: "0-1"
      postal_cpuset: "2-3"
      sink_cpuset: "4"
      loadgen_cpuset: "5"

  children:
    postal_main_db:
      hosts:
        stand:
    postal_message_db:
      hosts:
        stand:
    postal_admin:
      hosts:
        stand:
    postal_web:
      hosts:
        stand:
    postal_smtp:
      hosts:
        stand:
    postal_workers:
      hosts:
        stand:
    postal_load_balancers:
      hosts: {}
    test_dns:
      hosts:
        stand:
    postfix_sinks:
      hosts:
        stand:
    load_generators:
      hosts:
        stand:
    monitoring:
      hosts:
        stand:
    postal_specs:
      # Only one machine here, so the suite shares it with everything else. Do not run it
      # while measuring: the image build takes the cores the system under test needs.
      hosts:
        stand:
