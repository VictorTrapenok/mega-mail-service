---
# Cheap gate: syntax, inventory parsing and a check for forbidden secrets.
#
# There is no full benchmark run here and none is planned: the runner does not have
# enough resources, and outbound TCP/25 is blocked by GitHub at the platform level.

name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ansible-core ansible-lint yamllint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Parse inventory
        run: |
          for inv in inventories/*/; do
            echo "== $inv"
            ansible-inventory -i "$inv" --graph
          done

      - name: Check playbook syntax
        run: |
          for pb in playbooks/*.yml; do
            ansible-playbook -i inventories/single-host --syntax-check "$pb"
          done
