---
# Building our Postal fork on every commit that touches it, running its test suite, and
# publishing the image to the GitHub Container Registry so it can be handed over.
#
# The image is tagged by the SAME source identity the bench computes locally
# (roles/postal_image/tasks/local.yml). That is what makes a handover verifiable: the tag on
# the published image and the "Source tree" line in a run report are the same string, so the
# receiver can be told "this image is the build that produced that report" and it can be
# checked rather than asserted. The recipe below is duplicated from the role on purpose and
# the two must not drift.
#
# Publishing is gated on the test suite. An image nobody has tested is not something to put
# in front of anyone, and the bench does not need this workflow — it builds locally.

name: postal-image

# Every push, as asked. There is deliberately no paths filter: the image tag is derived
# from the source, so a commit that does not touch vendor/postal republishes the identical
# image under a new sha- tag and the layer cache makes that nearly free. Add
#   paths: ["vendor/postal/**", "group_vars/all/20-images.yml", ".github/workflows/postal-image.yml"]
# to save runner minutes — but note that GitHub does not evaluate path filters reliably for
# tag pushes, so a release build would then need the manual trigger.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  identity:
    name: Source identity
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.id.outputs.digest }}
      short: ${{ steps.id.outputs.short }}
      image: ${{ steps.id.outputs.image }}
      version: ${{ steps.id.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute the source digest and the image name
        id: id
        run: |
          set -euo pipefail

          # Kept identical to the snippet in roles/postal_image/tasks/local.yml and
          # roles/postal_specs/tasks/main.yml. git's own tree object id for vendor/postal,
          # taken through a throw-away index so it describes the working tree rather than
          # the last commit. It replaced a hash of a metadata-stripped tar archive, which
          # turned out to depend on the tar version: GNU tar 1.34 and 1.35 hashed a
          # byte-identical tree to 52733cbabb11 and 722b34598b73, so a workstation and this
          # runner disagreed about what the same source was called.
          idx="$(mktemp)"
          trap 'rm -f "$idx"' EXIT
          export GIT_INDEX_FILE="$idx"
          git read-tree HEAD >/dev/null 2>&1 || git read-tree --empty
          git add -A -- vendor/postal
          DIGEST=$(git write-tree --prefix=vendor/postal/)
          unset GIT_INDEX_FILE

          # The Postal version has one source of truth, and it is not this file.
          VERSION=$(grep -oP '^postal_version:\s*"\K[^"]+' group_vars/all/20-images.yml)

          # GHCR rejects uppercase in a repository name and GitHub owners may contain it.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/postal"

          {
            echo "digest=${DIGEST}"
            echo "short=${DIGEST:0:12}"
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "### Postal build \`src-${DIGEST:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- source tree: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Postal version \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test suite
    runs-on: ubuntu-24.04
    needs: identity
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The ci target skips asset precompilation, which the suite does not need and which is
      # the slowest layer. It must never be published — production.rb sets
      # config.assets.compile = false, so a ci image serves 500 on every page while a TCP
      # health check still calls it alive.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: vendor/postal
          target: ci
          push: false
          load: true
          tags: postal-bench/postal:ci-${{ needs.identity.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Postal's own compose file for the suite: the app against a throw-away MariaDB.
      - name: Run rspec
        working-directory: vendor/postal
        env:
          POSTAL_IMAGE: postal-bench/postal:ci-${{ needs.identity.outputs.short }}
        run: docker compose run --rm postal sh -c 'bundle exec rspec'

      - name: Stop the test stack
        if: always()
        working-directory: vendor/postal
        env:
          POSTAL_IMAGE: postal-bench/postal:ci-${{ needs.identity.outputs.short }}
        run: docker compose down --volumes

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-24.04
    needs: [identity, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # src-<digest> is the tag to hand over: it names the code and nothing else, so the
      # same source always resolves to the same tag and a different source never can.
      # sha-<commit> answers "which commit of the bench repo", latest is a convenience for
      # the default branch only, and a v* git tag is carried through for releases.
      - name: Assemble the tag list
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ needs.identity.outputs.image }}"
          {
            echo 'list<<EOF'
            echo "${IMAGE}:src-${{ needs.identity.outputs.short }}"
            echo "${IMAGE}:sha-${GITHUB_SHA::12}"
            if [ "${GITHUB_REF}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
              echo "${IMAGE}:latest"
            fi
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${IMAGE}:${GITHUB_REF_NAME}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: vendor/postal
          target: full
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.identity.outputs.version }}
            BRANCH=bench-${{ needs.identity.outputs.short }}
          # bench.source.tree is the same label the local build bakes in, and it is what
          # both build.yml and the run report read off the RUNNING container. Without it an
          # image published here could not prove which source it came from.
          labels: |
            bench.source.tree=${{ needs.identity.outputs.digest }}
            bench.postal.version=${{ needs.identity.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Postal ${{ needs.identity.outputs.version }}, source ${{ needs.identity.outputs.short }}

      - name: Say what was published
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.list }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
