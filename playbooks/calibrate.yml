---
# Calibration of the auxiliary chain.
#
# Without it, it is easy to measure Postfix and never notice: the Postfix defaults limit
# reception before Postal tops out, and the resulting drop looks like a measurement
# of Postal. The playbook FAILS when there is no headroom, rather than warning.

- name: Gather facts from all hosts
  hosts: all
  gather_facts: true
  tasks: []

- name: Measure the ceiling of the generator to sink path
  hosts: load_generators
  become: true
  vars:
    # The parentheses are mandatory. Without them Jinja parses the expression as
    # a * (b | round | int), i.e. it rounds the headroom factor
    # rather than the product, and the calibration target rate silently becomes
    # target x 2 for any value of bench_calibration_headroom.
    calib_rate: "{{ ((bench_target_rate | int) * (bench_calibration_headroom | float)) | round | int }}"
    calib_messages: 20000
  tasks:
    - name: Read the sink counter before calibration
      ansible.builtin.shell:
        cmd: "grep -c 'status=sent ({{ postfix_sink_discard_token }})' {{ postfix_sink_log }} || true"
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['postfix_sinks'] | first }}"
      register: calib_before
      changed_when: false

    - name: Record the start time
      ansible.builtin.command:
        argv: [date, -u, +%s]
      changed_when: false
      register: calib_t0

    # --entrypoint is mandatory: the ENTRYPOINT of the sink image starts Postfix
    # and ignores the command passed to it, so without the override
    # smtp-source would not run at all and calibration would "pass"
    # having measured nothing.
    - name: Drive load straight into the sink, bypassing Postal
      ansible.builtin.command:
        argv:
          - docker
          - run
          - "--rm"
          - "--network=host"
          - "--entrypoint"
          - /usr/sbin/smtp-source
          - "{{ postfix_sink_image }}"
          - "-s"
          - "20"
          - "-l"
          - "{{ bench_profiles[bench_profile].mime_size_bytes }}"
          - "-m"
          - "{{ calib_messages }}"
          - "-f"
          - "bench@{{ postal_test_domain }}"
          - "-t"
          - "sink@d0001.{{ postal_test_domain }}"
          - "{{ postfix_sink_addrs | first }}:{{ postfix_sink_port }}"
      changed_when: true

    - name: Record the end time
      ansible.builtin.command:
        argv: [date, -u, +%s]
      changed_when: false
      register: calib_t1

    - name: Read the sink counter after calibration
      ansible.builtin.shell:
        cmd: "grep -c 'status=sent ({{ postfix_sink_discard_token }})' {{ postfix_sink_log }} || true"
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['postfix_sinks'] | first }}"
      register: calib_after
      changed_when: false

    # Rate, not count. A "did all messages arrive" check would also pass
    # on a sink that accepts them three times slower than needed —
    # i.e. it would guard against the wrong thing.
    - name: Compute the achieved rate
      ansible.builtin.set_fact:
        calib_delivered: "{{ (calib_after.stdout | trim | int) - (calib_before.stdout | trim | int) }}"
        calib_seconds: "{{ [(calib_t1.stdout | trim | int) - (calib_t0.stdout | trim | int), 1] | max }}"

    - name: Write the calibration result
      ansible.builtin.copy:
        dest: "{{ bench_reports_dir }}/calibration-{{ calib_t1.stdout | trim }}.md"
        mode: "0644"
        content: |
          # Calibration of the auxiliary chain

          The smtp-source message generator sent straight into the sink, bypassing Postal.

          - accepted by the sink: {{ calib_delivered }} messages in {{ calib_seconds }} s
          - achieved rate: {{ ((calib_delivered | int) / (calib_seconds | int)) | round(1) }} messages/s
          - target run rate: {{ bench_target_rate }} recipients/s
          - required headroom: {{ bench_calibration_headroom }}x = {{ calib_rate }} messages/s
          - message size: {{ bench_profiles[bench_profile].mime_size_bytes }} bytes

          smtp-source works in a closed-loop model: it sends as fast as
          the sink accepts, so the measured value is
          the ceiling of the auxiliary chain, not a configured rate.
      delegate_to: localhost
      become: false

    - name: Check the headroom against the target rate
      ansible.builtin.assert:
        that:
          - (calib_delivered | int) >= (calib_messages | int)
          - ((calib_delivered | int) / (calib_seconds | int)) >= (calib_rate | int)
        fail_msg: >-
          The auxiliary chain sustains
          {{ ((calib_delivered | int) / (calib_seconds | int)) | round(1) }} messages/s
          against the required {{ calib_rate }} ({{ bench_calibration_headroom }}x
          of {{ bench_target_rate }}). A Postal run would be measuring the sink,
          not Postal. Check in_flow_delay, default_process_limit,
          smtpd_client_connection_count_limit and whether the sink log
          is hitting the disk limit.
        success_msg: >-
          The sink sustains
          {{ ((calib_delivered | int) / (calib_seconds | int)) | round(1) }} messages/s
          against the required {{ calib_rate }} — headroom confirmed.
