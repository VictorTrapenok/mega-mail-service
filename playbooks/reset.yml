---
# Bringing the test bench to an identical starting state.
# Destructive and non-idempotent by design.

- name: Gather facts from all hosts
  hosts: all
  gather_facts: true
  tasks: []

- name: Reset state
  hosts: postal_main_db
  become: true
  vars:
    postal_seed: "{{ hostvars[groups['postal_admin'] | first].postal_seed }}"
  roles:
    - bench_reset
