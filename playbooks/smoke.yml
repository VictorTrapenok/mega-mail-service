---
# Smoke test: a message travelled generator → Postal → sink → discard,
# and nothing escaped to the outside in the process.
#
# Both checks are tied to a SPECIFIC sent message. A grep over the whole
# log without a marker would pass on any bench that has ever delivered
# anything — i.e. it would only prove that the bench is not brand new.

- name: Gather facts from all hosts
  hosts: all
  gather_facts: true
  tasks: []

- name: Prepare the run marker
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate the marker
      ansible.builtin.set_fact:
        # The parentheses are mandatory: the filter binds tighter than exponentiation,
        # and without them the expression would read as 10 ** (9 | random).
        smoke_tag: "smoke{{ (10**9) | random }}"

- name: Check the end-to-end path of a message
  hosts: load_generators
  become: true
  vars:
    postal_seed: "{{ hostvars[groups['postal_admin'] | first].postal_seed }}"
    smoke_tag: "{{ hostvars['localhost'].smoke_tag }}"
  tasks:
    - name: Send a message via the HTTP API
      ansible.builtin.uri:
        url: "http://{{ postal_api_addr }}/api/v1/send/message"
        method: POST
        headers:
          X-Server-API-Key: "{{ postal_seed.api_key }}"
          Content-Type: application/json
          # Postal does config.hosts << web_hostname, and a non-empty config.hosts
          # enables Rails host authorization: a request by IP address gets a 403.
          Host: "{{ postal_web_hostname }}"
        body_format: json
        body:
          to: ["{{ smoke_tag }}-lab@d0001.{{ postal_test_domain }}"]
          from: "bench@{{ postal_test_domain }}"
          subject: "smoke {{ smoke_tag }}"
          plain_body: "smoke test"
        status_code: 200
      register: smoke_send

    # Postal answers with HTTP 200 on errors as well: the body then carries
    # status: "error". Checking the response code is not enough.
    - name: Make sure the message was accepted
      ansible.builtin.assert:
        that: smoke_send.json.status == "success"
        fail_msg: "Postal did not accept the message: {{ smoke_send.json }}"

    - name: Send a message to a real public domain
      ansible.builtin.uri:
        url: "http://{{ postal_api_addr }}/api/v1/send/message"
        method: POST
        headers:
          X-Server-API-Key: "{{ postal_seed.api_key }}"
          Content-Type: application/json
          Host: "{{ postal_web_hostname }}"
        body_format: json
        body:
          to: ["{{ smoke_tag }}-escape@gmail.com"]
          from: "bench@{{ postal_test_domain }}"
          subject: "smoke escape {{ smoke_tag }}"
          plain_body: "escape test"
        status_code: 200
      register: smoke_escape

- name: Check delivery into the sink
  hosts: postfix_sinks
  become: true
  vars:
    smoke_tag: "{{ hostvars['localhost'].smoke_tag }}"
  tasks:
    - name: Wait for the delivery of THIS PARTICULAR message
      ansible.builtin.shell:
        cmd: >-
          grep -c 'to=<{{ smoke_tag }}-lab@' {{ postfix_sink_log }} || true
      args:
        executable: /bin/bash
      register: sink_hits
      until: (sink_hits.stdout | trim | int) > 0
      retries: 30
      delay: 2
      changed_when: false

    # The message to the public domain must not reach anywhere: the internal DNS
    # does not resolve external MX records, so delivery breaks before any connection.
    - name: Make sure the message to the public domain was NOT delivered
      ansible.builtin.shell:
        cmd: >-
          grep -c 'to=<{{ smoke_tag }}-escape@' {{ postfix_sink_log }} || true
      args:
        executable: /bin/bash
      register: sink_escape_hits
      changed_when: false
      failed_when: (sink_escape_hits.stdout | trim | int) > 0

# The group pattern is written out as a literal: the hosts field is parsed before
# group_vars are loaded, so the containment_hosts variable does not yet exist there.
# The set matches the containment play in site.yml.
- name: Check that nothing escaped to the outside
  hosts: postal_web:postal_smtp:postal_workers:postfix_sinks
  become: true
  tasks:
    - name: Read the outbound SMTP attempt counter
      ansible.builtin.shell:
        cmd: >-
          nft -j list counter inet mailguard smtp_escape_attempts
          | python3 -c "import sys,json; print(json.load(sys.stdin)['nftables'][1]['counter']['packets'])"
      args:
        executable: /bin/bash
      register: escape_packets
      changed_when: false

    # An unreadable counter is not a zero. Missing containment rules must
    # fail the check, not look like it passed successfully.
    - name: Make sure the counter exists and equals zero
      ansible.builtin.assert:
        that:
          - escape_packets.rc == 0
          - (escape_packets.stdout | trim | int) == 0
        fail_msg: >-
          On {{ inventory_hostname }} the leak counter equals
          "{{ escape_packets.stdout | trim }}" (rc {{ escape_packets.rc }}).
          Either a message tried to escape to the internet, or there are no
          containment rules on the host at all — runs must not be started until
          the cause is found.
