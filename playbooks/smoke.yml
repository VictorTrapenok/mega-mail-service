---
# Smoke-тест: письмо прошло генератор → Postal → приёмник → discard,
# и при этом ничего не ушло наружу.
#
# Обе проверки привязаны к КОНКРЕТНОМУ отправленному письму. Grep по всему
# логу без метки проходил бы на любом стенде, который когда-либо что-то
# доставил, — то есть доказывал бы только то, что стенд не новый.

- name: Собрать факты со всех хостов
  hosts: all
  gather_facts: true
  tasks: []

- name: Подготовить метку прогона
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Сгенерировать метку
      ansible.builtin.set_fact:
        # Скобки обязательны: фильтр связывает крепче возведения в степень,
        # и без них выражение читалось бы как 10 ** (9 | random).
        smoke_tag: "smoke{{ (10 ** 9) | random }}"

- name: Проверить сквозной путь письма
  hosts: load_generators
  become: true
  vars:
    postal_seed: "{{ hostvars[groups['postal_admin'] | first].postal_seed }}"
    smoke_tag: "{{ hostvars['localhost'].smoke_tag }}"
  tasks:
    - name: Отправить письмо через HTTP API
      ansible.builtin.uri:
        url: "http://{{ postal_web_addrs | first }}:{{ postal_web_port }}/api/v1/send/message"
        method: POST
        headers:
          X-Server-API-Key: "{{ postal_seed.api_key }}"
          Content-Type: application/json
          # Postal делает config.hosts << web_hostname, а непустой config.hosts
          # включает host authorization Rails: запрос по IP-адресу получает 403.
          Host: "{{ postal_web_hostname }}"
        body_format: json
        body:
          to: ["{{ smoke_tag }}-lab@d0001.{{ postal_test_domain }}"]
          from: "bench@{{ postal_test_domain }}"
          subject: "smoke {{ smoke_tag }}"
          plain_body: "smoke test"
        status_code: 200
      register: smoke_send

    # Postal отвечает HTTP 200 и на ошибку тоже: в теле приходит
    # status: "error". Проверять код ответа недостаточно.
    - name: Убедиться, что письмо принято
      ansible.builtin.assert:
        that: smoke_send.json.status == "success"
        fail_msg: "Postal не принял письмо: {{ smoke_send.json }}"

    - name: Отправить письмо на реальный публичный домен
      ansible.builtin.uri:
        url: "http://{{ postal_web_addrs | first }}:{{ postal_web_port }}/api/v1/send/message"
        method: POST
        headers:
          X-Server-API-Key: "{{ postal_seed.api_key }}"
          Content-Type: application/json
          Host: "{{ postal_web_hostname }}"
        body_format: json
        body:
          to: ["{{ smoke_tag }}-escape@gmail.com"]
          from: "bench@{{ postal_test_domain }}"
          subject: "smoke escape {{ smoke_tag }}"
          plain_body: "escape test"
        status_code: 200
      register: smoke_escape

- name: Проверить доставку в приёмник
  hosts: postfix_sinks
  become: true
  vars:
    smoke_tag: "{{ hostvars['localhost'].smoke_tag }}"
  tasks:
    - name: Дождаться доставки ИМЕННО этого письма
      ansible.builtin.shell:
        cmd: >-
          grep -c 'to=<{{ smoke_tag }}-lab@' {{ postfix_sink_log }} || true
      args:
        executable: /bin/bash
      register: sink_hits
      until: (sink_hits.stdout | trim | int) > 0
      retries: 30
      delay: 2
      changed_when: false

    # Письмо публичному домену не должно дойти никуда: внутренний DNS
    # не резолвит внешние MX, поэтому доставка обрывается ещё до соединения.
    - name: Убедиться, что письмо публичному домену НЕ доставлено
      ansible.builtin.shell:
        cmd: >-
          grep -c 'to=<{{ smoke_tag }}-escape@' {{ postfix_sink_log }} || true
      args:
        executable: /bin/bash
      register: sink_escape_hits
      changed_when: false
      failed_when: (sink_escape_hits.stdout | trim | int) > 0

# Шаблон групп записан литералом: поле hosts разбирается до загрузки
# group_vars, поэтому переменная containment_hosts там ещё не существует.
# Набор совпадает с плеем изоляции в site.yml.
- name: Проверить, что наружу ничего не ушло
  hosts: postal_web:postal_smtp:postal_workers:postfix_sinks
  become: true
  tasks:
    - name: Прочитать счётчик попыток исходящего SMTP
      ansible.builtin.shell:
        cmd: >-
          nft -j list counter inet mailguard smtp_escape_attempts
          | python3 -c "import sys,json; print(json.load(sys.stdin)['nftables'][1]['counter']['packets'])"
      args:
        executable: /bin/bash
      register: escape_packets
      changed_when: false

    # Нечитаемый счётчик — это не ноль. Отсутствие правил изоляции обязано
    # валить проверку, а не выглядеть как её успешное прохождение.
    - name: Убедиться, что счётчик существует и равен нулю
      ansible.builtin.assert:
        that:
          - escape_packets.rc == 0
          - (escape_packets.stdout | trim | int) == 0
        fail_msg: >-
          На {{ inventory_hostname }} счётчик утечек равен
          «{{ escape_packets.stdout | trim }}» (код {{ escape_packets.rc }}).
          Либо письмо пыталось уйти в интернет, либо правил изоляции
          на хосте нет вовсе — прогоны запускать нельзя, пока причина
          не найдена.
