---
# Data seeding and honest domain verification through the bench DNS.
#
# The order is mandatory and consists of two DNS passes: the name and the value
# of the DKIM record are generated by Postal itself when the domain is created, so
# placing them in the zone in advance is impossible.

- name: Seed the organisation, server, domain and credentials
  hosts: postal_admin
  become: true
  roles:
    - postal_seed

- name: Publish the domain records in a second pass
  hosts: test_dns
  become: true
  vars:
    postal_seed: "{{ hostvars[groups['postal_admin'] | first].postal_seed }}"
  roles:
    - test_dns

- name: Verify the domain through the bench DNS
  hosts: postal_admin
  become: true
  vars:
    postal_seed: "{{ hostvars[groups['postal_admin'] | first].postal_seed }}"
  tasks:
    - name: Run the DNS check for the domain
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - "-f"
          - "{{ postal_dir }}/docker-compose.yml"
          - "--profile"
          - tools
          - run
          - "--rm"
          - "-T"
          - runner
          - bundle
          - exec
          - rails
          - runner
          - >-
            d = Domain.find({{ postal_seed.domain_id }});
            d.verify_with_dns;
            puts "VERIFIED=#{d.verified?}"
      register: domain_verify
      changed_when: true

    # The only gate on sending is verified_at. Without it any send
    # fails with "530 From/Sender name is not valid", and that looks like
    # a broken generator rather than incomplete configuration.
    - name: Make sure the domain is verified
      ansible.builtin.assert:
        that: "'VERIFIED=true' in domain_verify.stdout"
        fail_msg: >-
          The domain failed verification through the bench DNS. Check that the zone
          serves the TXT record with the verification string and the DKIM record, and that
          POSTAL_USE_LOCAL_NS_FOR_DOMAIN_VERIFICATION=true — it defaults to
          false, in which case Postal first resolves the domain's NS, which does not
          work in .test. Last-resort workaround:
          -e postal_force_domain_verification=true (it lowers the credibility of the
          run and is flagged in the report).
