---
# Measuring queue drain rate in isolation from ingress.
#
# The queue is filled in advance while the workers are stopped, then ingress stays silent
# and all the hardware goes to delivery. The denominator of the rate is known exactly, and the
# queue length can be set: both hot worker queries are not covered by indexes,
# so the cost of dequeuing depends on the queue length, and a measurement on an empty
# queue describes a case that does not occur in production.
#
# The playbook is NON-idempotent by design and is not part of the repeatability criterion.

- name: Gather facts from all hosts
  hosts: all
  gather_facts: true
  tasks: []

- name: Assign the run identifier
  hosts: all
  gather_facts: false
  tasks:
    - name: Take the time from a live clock
      ansible.builtin.command:
        argv: [date, -u, "+%Y%m%dT%H%M%SZ"]
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: run_clock

    - name: Pin the run identifier
      ansible.builtin.set_fact:
        bench_run_id: >-
          {{ lookup('env', 'BENCH_RUN_ID') | default('drain-' ~ (run_clock.stdout | trim), true) }}

# Before reset.yml, not after: deploying a new image recreates the containers, and a
# worker coming back up starts draining whatever is still in the queue. Resetting
# afterwards is what guarantees the run starts from the same state as every other.
#
# It costs nothing when vendor/postal is unchanged — the image built from that source
# already exists and neither the build nor the redeploy does any work.
- name: Build and deploy the image under test
  ansible.builtin.import_playbook: build.yml
  when: postal_build_before_run | bool

- name: Prepare the state before the run
  ansible.builtin.import_playbook: reset.yml

- name: Stop the delivery workers
  hosts: postal_workers
  become: true
  tasks:
    - name: Move the workers to the stopped state
      ansible.builtin.include_role:
        name: bench_workers
      vars:
        bench_workers_state: stopped

- name: Fill the queue and measure the drain
  hosts: postal_main_db:postal_workers:postal_smtp:postfix_sinks:load_generators
  become: true
  vars:
    postal_seed: "{{ hostvars[groups['postal_admin'] | first].postal_seed }}"
  roles:
    - role: bench_samplers
      vars:
        bench_samplers_state: started
    - bench_prefill
    - bench_drain
    - role: bench_samplers
      vars:
        bench_samplers_state: stopped

- name: Collect the report
  hosts: postal_main_db
  become: true
  vars:
    db_host: "{{ groups['postal_main_db'] | first }}"
    bench_report_kind: drain
    postal_seed: "{{ hostvars[groups['postal_admin'] | first].postal_seed }}"
    # The fact only lives in the cache: it is set by the postal_image role during deployment.
    # A run must not fail because of an empty cache — the report reads the actually running
    # image from the host via docker inspect anyway, and that is more reliable.
    postal_image_resolved: >-
      {{ hostvars[groups['postal_workers'] | first].postal_image_resolved
         | default('undetermined: the fact cache is empty, see the actually running image', true) }}
    # Empty rather than a placeholder: the report treats an empty value as "this run did
    # not build from the fork" and prints the row accordingly.
    postal_build_source_digest: >-
      {{ hostvars[groups['postal_workers'] | first].postal_build_source_digest
         | default('', true) }}
    # The reconciliation window covers the prefill as well: the messages are created there, not
    # during the drain, so a selection based on the drain time alone would find
    # no rows in messages at all.
    bench_window_start: "{{ hostvars[db_host].bench_prefill_start }}"
    bench_window_end: "{{ hostvars[db_host].bench_drain_end }}"
    bench_queue_total: "{{ hostvars[db_host].bench_queue_total }}"
    bench_queue_ready: "{{ hostvars[db_host].bench_queue_ready }}"
    bench_queue_deferred: "{{ hostvars[db_host].bench_queue_deferred }}"
    bench_drain_start: "{{ hostvars[db_host].bench_drain_start }}"
    bench_drain_end: "{{ hostvars[db_host].bench_drain_end }}"
    bench_drain_queue_total_at_start: "{{ hostvars[db_host].bench_drain_queue_total_at_start }}"
    bench_drain_queue_ready_at_start: "{{ hostvars[db_host].bench_drain_queue_ready_at_start }}"
    bench_drain_completed: "{{ hostvars[db_host].bench_drain_completed }}"
    bench_drain_ready_left: "{{ hostvars[db_host].bench_drain_ready_left }}"
    bench_drain_queue_left: "{{ hostvars[db_host].bench_drain_queue_left }}"
    bench_drain_in_flight: "{{ hostvars[db_host].bench_drain_in_flight }}"
    bench_drain_delivered: "{{ hostvars[db_host].bench_drain_delivered }}"
    bench_drain_sources: "{{ hostvars[db_host].bench_drain_sources }}"
    bench_drain_throttled: "{{ hostvars[db_host].bench_drain_throttled }}"
    bench_drain_throttled_by_ip: "{{ hostvars[db_host].bench_drain_throttled_by_ip }}"
    bench_drain_throttled_by_reason: "{{ hostvars[db_host].bench_drain_throttled_by_reason }}"
    bench_drain_softfail_other: "{{ hostvars[db_host].bench_drain_softfail_other }}"
    bench_drain_attempts: "{{ hostvars[db_host].bench_drain_attempts }}"
    bench_drain_attempts_sent: "{{ hostvars[db_host].bench_drain_attempts_sent }}"
    bench_drain_attempts_by_status: "{{ hostvars[db_host].bench_drain_attempts_by_status }}"
    bench_drain_unique_recipients: "{{ hostvars[db_host].bench_drain_unique_recipients }}"
    bench_drain_accepted_total: "{{ hostvars[db_host].bench_drain_accepted_total }}"
    bench_drain_ttd_count: "{{ hostvars[db_host].bench_drain_ttd_count }}"
    bench_drain_ttd_p50: "{{ hostvars[db_host].bench_drain_ttd_p50 }}"
    bench_drain_ttd_p95: "{{ hostvars[db_host].bench_drain_ttd_p95 }}"
    bench_drain_ttd_p99: "{{ hostvars[db_host].bench_drain_ttd_p99 }}"
  roles:
    - bench_report
