---
# Container resource limits.
#
# Verified against pkg/compose/create.go: in plain (non-swarm) docker compose,
# deploy.resources.limits.{cpus,memory,pids} and reservations.memory take effect,
# while reservations.cpus is silently ignored. deploy is applied AFTER the top-level
# cpus/mem_limit and overrides them, so we set deploy only.
#
# cpuset_cpus is preferable to cpus for comparative runs: the CFS quota throttles
# the container at 100 ms period boundaries while reporting an average load noticeably
# below 100 %, and two builds running under different effective quotas are not comparable.
# On a single host this is the only way to spread the SUT, the sink and the generator across cores.

postal_limits:
  web:
    cpus: "1.0"
    memory: "1g"
  smtp:
    cpus: "2.0"
    memory: "2g"
  worker:
    cpus: "2.0"
    memory: "2g"

mariadb_limits:
  cpus: "4.0"
  memory: "8g"

# The balancer is event-driven and consumes almost nothing at these rates,
# but the limit is set explicitly: without it, it would compete for cores with what we measure.
postal_lb_limits:
  cpus: "1.0"
  memory: "512m"

sink_limits:
  cpus: "2.0"
  # Must exceed postfix_sink_spool_tmpfs_size: tmpfs pages
  # count towards the container's memory.
  memory: "4g"

loadgen_limits:
  cpus: "2.0"
  memory: "2g"

# CPU pinning. Empty = do not pin (distributed mode,
# where the components already sit on different machines).
postal_cpuset: ""
mariadb_cpuset: ""
sink_cpuset: ""
loadgen_cpuset: ""
