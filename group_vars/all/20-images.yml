---
# Images.
#
# --- Which Postal build is under test -------------------------------------
#
# upstream — the official ghcr.io image (the baseline). Numbers obtained on it are
#            comparable with the reference runs in reports/reference/.
# local    — an image built from the fork in vendor/postal (the candidate). This is the
#            only path by which an added index or an edited worker reaches a run.
#
# The default is "local" because that is what this repository is for: the fork is
# vendored at the pristine upstream tag, so a local build with no edits is the same
# code as the baseline, and every edit made to vendor/postal is in the next run
# automatically. Switch back with -e postal_image_source=upstream to re-measure the
# official image without touching the fork.
#
# The two settings below apply to their own branch only: postal_image_ref is read by the
# upstream path, the postal_build_* values by the local one.
postal_image_source: "local"

# Provenance of the fork in vendor/postal. Both values end up in the run report: without
# them "which build produced this number" has no answer that can be checked later.
# Update them together with the source — see docs/custom-builds.md.
postal_build_upstream_repo: "https://github.com/postalserver/postal.git"
postal_build_upstream_ref: "3.3.7"
postal_build_upstream_commit: "d038eaa8c763d3cafa797ccd6f773d53470bd336"

# The local image is tagged postal_build_image_repo:src-<first 12 hex of the source
# digest>. The tag is therefore content-addressed: it changes if and only if the source
# changes, which is what lets every measurement playbook ask for a build before the run
# and pay nothing when nothing was edited.
postal_build_image_repo: "postal-bench/postal"

# Build (and redeploy) the image before every measured run. Left on so that a run always
# tests the source currently in the working tree — the failure mode this prevents is
# editing the worker, running benchmark.yml and measuring the previous build.
postal_build_before_run: true

# --- The official image ---------------------------------------------------
#
# postal_image_ref may be either a tag OR a digest, but the postal_image role always
# resolves it to a digest and deploys exactly that digest, recording both values
# in the run report. The reason: latest and stable on ghcr.io are moving pointers
# with different digests, floating tags 3 and 3.3 do not exist, and the baseline must not
# change between the first and the last run of a series.
postal_image_repo: "ghcr.io/postalserver/postal"
postal_image_ref: "3.3.7"

# Tags the role is required to reject.
# ci-* images are built with --target ci, without asset precompilation: production.rb sets
# config.assets.compile = false, so web returns 500 on every page
# while the TCP health check still stays green.
postal_image_forbidden_refs:
  - "latest"
  - "stable"
  - "branch-*"
  - "ci-*"

# Postal supports MariaDB 10.6+; MySQL is not officially supported.
mariadb_image_ref: "mariadb:11.4"

coredns_image_ref: "coredns/coredns:1.11.3"

# HTTP API load balancer. It is needed because ingress scales by processes:
# MRI Ruby has a GVL, and a single Puma process cannot use more than one core.
haproxy_image_ref: "haproxy:3.0-alpine"

# The Postfix sink and the load generator are built locally from the Dockerfiles in
# roles/*/files, so as not to depend on third-party images of dubious origin.
postfix_sink_image: "postal-bench/postfix-sink:local"
loadgen_image_ref: "grafana/k6:0.53.0"
