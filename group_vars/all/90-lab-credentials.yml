---
# Lab credentials.
#
# They are kept in the repository in plain text DELIBERATELY. The test bench is isolated in
# the .test zone, outbound SMTP is blocked by the firewall, there is nothing to protect here,
# and pinning passwords and keys in git is exactly what makes a run reproducible: the same
# credential keys mean the generator authenticates identically
# across all runs of a series.
#
# Postal generates the credential key itself (SecureRandom.alphanumeric(24)) and
# forbids changing it through the model (validate_key_cannot_be_changed), so
# seeding sets the values below via update_column. Without that, re-running the seed
# would silently rotate the keys and the generator would start getting 535 —
# an error that looks like a regression of the build under test.
#
# What does NOT go into the repository: the client fork's deploy key, registry
# credentials, production DKIM keys, production dumps.

mariadb_root_password: "benchroot"
mariadb_postal_user: "postal"
mariadb_postal_password: "benchpostal"

postal_admin_email: "admin@bench.test"
postal_admin_password: "benchadmin"
postal_admin_first_name: "Bench"
postal_admin_last_name: "Admin"

postal_organization_name: "Bench"
postal_organization_permalink: "bench"
postal_server_name: "Loadtest"
postal_server_permalink: "loadtest"

# Exactly 24 characters — the format Postal generates itself.
postal_api_key: "benchapikey0000000000001"
postal_smtp_key: "benchsmtpkey000000000001"

# SMTP AUTH in Postal checks the password only: Credential.where(type: 'SMTP', key: password).
# The username is ignored, so this is just a placeholder.
postal_smtp_username: "bench"
