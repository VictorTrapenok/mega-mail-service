---
# Лабораторные учётные данные.
#
# Они лежат в репозитории открытым текстом СОЗНАТЕЛЬНО. Стенд изолирован в зоне
# .test, исходящий SMTP запрещён файрволом, защищать здесь нечего, а фиксация
# паролей и ключей в git — это то, что делает прогон воспроизводимым: те же
# ключи credentials означают, что генератор аутентифицируется одинаково
# во всех прогонах серии.
#
# Postal генерирует ключ credential сам (SecureRandom.alphanumeric(24)) и
# запрещает менять его через модель (validate_key_cannot_be_changed), поэтому
# сидирование выставляет значения ниже через update_column. Без этого повторный
# запуск сидирования молча ротировал бы ключи, и генератор начал бы получать 535 —
# ошибка, которая выглядит как регрессия тестируемой сборки.
#
# В репозиторий НЕ попадают: deploy-key клиентского форка, учётные данные
# registry, продовые DKIM-ключи, продовые дампы.

mariadb_root_password: "benchroot"
mariadb_postal_user: "postal"
mariadb_postal_password: "benchpostal"

postal_admin_email: "admin@bench.test"
postal_admin_password: "benchadmin"
postal_admin_first_name: "Bench"
postal_admin_last_name: "Admin"

postal_organization_name: "Bench"
postal_organization_permalink: "bench"
postal_server_name: "Loadtest"
postal_server_permalink: "loadtest"

# Ровно 24 символа — формат, который Postal генерирует сам.
postal_api_key: "benchapikey0000000000001"
postal_smtp_key: "benchsmtpkey000000000001"

# SMTP AUTH в Postal сверяет только пароль: Credential.where(type: 'SMTP', key: password).
# Имя пользователя игнорируется, поэтому здесь просто заглушка.
postal_smtp_username: "bench"
