---
# Load profile and run parameters.
#
# The primary profile is FROZEN and does not change between builds — otherwise the
# comparison becomes meaningless. Additional profiles do not replace the primary one.

bench_profile: primary

bench_profiles:
  primary:
    # 1 recipient per message, so recipients == messages and reconciliation is simple.
    recipients_per_message: 1
    mime_size_bytes: 102400
    # Domain cardinality matters fundamentally: batch_key = "outgoing-<domain>"
    # packs up to 100 messages into a batch, so sending to a single domain hands Postal
    # a free ~100x win and makes the baseline dishonest.
    destination_domains: 1000
    destination_skew: zipf
    tracking: false
    dkim: true
    webhooks: false

  # High domain cardinality profile. It is needed because the batching query
  # (batchable_messages) is not covered by an index and stops only once it has collected
  # 100 rows with the same batch_key, or at the end of the table. The rarer the batch_key
  # matches, the more often it runs to the end, so a wide mailing costs
  # dramatically more than a narrow one at the same queue length.
  wide_domains:
    recipients_per_message: 1
    mime_size_bytes: 102400
    destination_domains: 100000
    destination_skew: zipf
    tracking: false
    dkim: true
    webhooks: false

# Target rate, recipients per second.
# 5M over 24h = 58 rcpt/s on average.
bench_target_rate: 58

# Run phases, seconds.
bench_warmup_s: 180
bench_duration_s: 900
bench_drain_timeout_s: 900

# Headroom of generator virtual users relative to the configured rate.
# By Little's law, a rate R at latency L requires R*L concurrent VUs,
# so the VU ceiling itself limits the achievable rate: at a factor of 10 the
# run could not sustain 58 messages/s once ingress latency reached 10 s,
# and the generator started dropping iterations. A non-zero dropped_iterations means
# the generator was the limiter, not the system under test.
bench_max_vu_factor: 30

# --- Queue prefill --------------------------------------------------------
# Queue length is not profile cosmetics but the main variable in the cost of dequeuing.
# Both hot worker queries (row claim and batch assembly) are covered by no index at all,
# so on an empty queue the full-scan hypothesis cannot be tested whatsoever,
# and the measured rate describes a case that does not exist in production.
bench_prefill_recipients: 50000
bench_prefill_burst_vus: 32
bench_prefill_timeout_s: 3600

# Fraction of rows moved to deferred state (retry_after in the future), from 0 to 1.
# The oldest rows by primary key are deferred, because that is exactly how
# a queue degenerates in production: a message got a temporary rejection and stayed
# at the head of the table with its former id, while new messages get larger ids.
# The claim query scans by primary key without ORDER BY and stops
# at the first suitable row, so a not-ready head of the table is precisely what
# turns the claim from O(1) into a full scan.
bench_prefill_deferred_share: 0.0
bench_prefill_deferred_delay_s: 3600

# --- Sink realism --------------------------------------------------------
# These two knobs decide how close the measurement is to production, and they live here
# rather than in the sink role because the report reads them as well — it runs on the DB
# host, where a default of another role is not visible, and would otherwise print the
# default instead of the value actually in effect.

# Artificial latency of the sink's SMTP responses, milliseconds. 0 disables it.
#
# Needed because a sink that answers instantly measures the upper bound of Postal
# rather than production speed. Draining the queue is not a compute task but waiting
# on the network: its ceiling equals concurrency divided by the delivery latency.
# A real MX spends hundreds of milliseconds on a session — TCP, STARTTLS, DATA,
# the response — while ours replies from tmpfs in units of milliseconds.
#
# The delay is applied with tc netem to outgoing packets from port 25 only, so it
# models the network rather than altering Postfix itself. Traffic that the filter does
# not match goes through the default band without any delay — otherwise the run would
# take SSH down along with it.
postfix_sink_response_delay_ms: 0

# Simultaneous connections allowed from one client address. 0 means unlimited, which is
# what the primary profile uses: our concern there is Postal, not the sink.
#
# A non-zero value models what real recipient providers do — they cap concurrent sessions
# per source address — and it is the only way to make an IP pool show its purpose. With one
# sending address the cap wastes any worker concurrency above it; spread across a pool of
# addresses, the same cap allows limit x addresses in parallel.
#
# Mind the side effect: over the cap Postfix answers 421, which Postal classifies as a
# SoftFail and defers, so the run stops being a clean drain and becomes a measurement of
# how much got through before deferral. Mind also that the enforcing anvil service is
# single-process, so at very high connection rates it becomes a limiter of its own.
postfix_sink_client_connection_limit: 0


# Run class: debug (everything on one host, unsuitable for comparing builds)
# or scored (generator, SUT and sink on different hosts).
# Set automatically by preflight and included in the report.
bench_run_class: "{{ 'debug' if (groups['load_generators'] | intersect(groups['postal_workers'])) else 'scored' }}"

# Calibration: how many times faster than the target the generator-to-sink path must be.
# Without that headroom we measure Postfix while thinking we measure Postal.
bench_calibration_headroom: 2.0

# Polling interval of the lightweight samplers (queue depth, docker stats), seconds.
bench_sample_interval_s: 5

# Acceptable reconciliation discrepancy, as a fraction.
bench_reconcile_tolerance: 0.01

# Where reports are stored on the control machine.
bench_reports_dir: "{{ playbook_dir }}/../reports"

# --- Launching the generator ----------------------------------------------
# The command lives here rather than in role defaults for the same reason as the paths
# in 15-paths.yml: the generator is launched by several roles (bench_run, bench_prefill,
# bench_ingress), and a role default is only visible while that role is executing.
#
# The limits are applied here: without them the generator container competes
# with the system under test without any restriction, which is especially noticeable
# in the debug layout on a single machine.
bench_loadgen_argv:
  - docker
  - run
  - "--rm"
  - "--network=host"
  - "--cpus={{ loadgen_limits.cpus }}"
  - "--memory={{ loadgen_limits.memory }}"
  - "-v"
  - "{{ loadgen_dir }}:/scripts:ro"
  - "-v"
  - "{{ loadgen_results_dir }}:/results"
  - "-e"
  - "POSTAL_API_URL=http://{{ postal_api_addr }}"
  - "-e"
  - "POSTAL_WEB_HOST={{ postal_web_hostname }}"
  - "-e"
  - "POSTAL_API_KEY={{ postal_seed.api_key }}"
  - "-e"
  - "BENCH_RUN_ID={{ bench_run_id }}"
  - "-e"
  - "BENCH_DOMAIN={{ postal_test_domain }}"
  - "-e"
  - "BENCH_DOMAIN_COUNT={{ bench_profiles[bench_profile].destination_domains }}"
  - "-e"
  - "BENCH_MIME_SIZE={{ bench_profiles[bench_profile].mime_size_bytes }}"
  - "-e"
  - "BENCH_RATE={{ bench_target_rate }}"
  - "-e"
  - "BENCH_MAX_VU_FACTOR={{ bench_max_vu_factor }}"

# Pinning the generator to cores — only if it is set in the inventory.
# On a single machine this is the only way to stop the generator from stealing cores
# from the system under test.
bench_loadgen_cpuset_argv: "{{ ['--cpuset-cpus=' ~ loadgen_cpuset] if loadgen_cpuset | default('') else [] }}"
