---
# Load profile and run parameters.
#
# The primary profile is FROZEN and does not change between builds — otherwise the
# comparison becomes meaningless. Additional profiles do not replace the primary one.

bench_profile: primary

bench_profiles:
  primary:
    # 1 recipient per message, so recipients == messages and reconciliation is simple.
    recipients_per_message: 1
    mime_size_bytes: 102400
    # Domain cardinality matters fundamentally: batch_key = "outgoing-<domain>"
    # packs up to 100 messages into a batch, so sending to a single domain hands Postal
    # a free ~100x win and makes the baseline dishonest.
    destination_domains: 1000
    destination_skew: zipf
    tracking: false
    dkim: true
    webhooks: false

  # High domain cardinality profile. It is needed because the batching query
  # (batchable_messages) is not covered by an index and stops only once it has collected
  # 100 rows with the same batch_key, or at the end of the table. The rarer the batch_key
  # matches, the more often it runs to the end, so a wide mailing costs
  # dramatically more than a narrow one at the same queue length.
  wide_domains:
    recipients_per_message: 1
    mime_size_bytes: 102400
    destination_domains: 100000
    destination_skew: zipf
    tracking: false
    dkim: true
    webhooks: false

# Target rate, recipients per second.
# 5M over 24h = 58 rcpt/s on average.
bench_target_rate: 58

# Run phases, seconds.
bench_warmup_s: 180
bench_duration_s: 900
bench_drain_timeout_s: 900

# Headroom of generator virtual users relative to the configured rate.
# By Little's law, a rate R at latency L requires R*L concurrent VUs,
# so the VU ceiling itself limits the achievable rate: at a factor of 10 the
# run could not sustain 58 messages/s once ingress latency reached 10 s,
# and the generator started dropping iterations. A non-zero dropped_iterations means
# the generator was the limiter, not the system under test.
bench_max_vu_factor: 30

# --- Queue prefill --------------------------------------------------------
# Queue length is not profile cosmetics but the main variable in the cost of dequeuing.
# Both hot worker queries (row claim and batch assembly) are covered by no index at all,
# so on an empty queue the full-scan hypothesis cannot be tested whatsoever,
# and the measured rate describes a case that does not exist in production.
bench_prefill_recipients: 50000
bench_prefill_burst_vus: 32
bench_prefill_timeout_s: 3600

# Fraction of rows moved to deferred state (retry_after in the future), from 0 to 1.
# The oldest rows by primary key are deferred, because that is exactly how
# a queue degenerates in production: a message got a temporary rejection and stayed
# at the head of the table with its former id, while new messages get larger ids.
# The claim query scans by primary key without ORDER BY and stops
# at the first suitable row, so a not-ready head of the table is precisely what
# turns the claim from O(1) into a full scan.
bench_prefill_deferred_share: 0.0
bench_prefill_deferred_delay_s: 3600

# --- Sink realism --------------------------------------------------------
# These knobs decide how close the measurement is to production, and they live here
# rather than in the sink role because the report reads them as well — it runs on the DB
# host, where a default of another role is not visible, and would otherwise print the
# default instead of the value actually in effect.
#
# Two halves of one thing. The response delay models the NETWORK cost of a real MX, the
# per-IP limits model its POLICY. Neither substitutes for the other: with the delay alone
# an unlimited receiver still accepts any volume from one address, and with limits alone
# a session still completes in a millisecond.

# Artificial latency of the sink's SMTP responses, milliseconds. 0 disables it.
#
# Needed because a sink that answers instantly measures the upper bound of Postal
# rather than production speed. Draining the queue is not a compute task but waiting
# on the network: its ceiling equals concurrency divided by the delivery latency.
# A real MX spends hundreds of milliseconds on a session — TCP, STARTTLS, DATA,
# the response — while ours replies from tmpfs in units of milliseconds.
#
# The delay is applied with tc netem to outgoing packets from port 25 only, so it
# models the network rather than altering Postfix itself. Traffic that the filter does
# not match goes through the default band without any delay — otherwise the run would
# take SSH down along with it.
postfix_sink_response_delay_ms: 0

# --- Per-IP limits of the receiving side --------------------------------
# The sink profile is an axis of its own, independent of bench_profile: throttling is a
# property of the receiver, not of the load, and the primary load profile is frozen.
#
# WHY THIS EXISTS. Without limits the bench measures the upper bound of Postal against a
# receiver that no real provider resembles: unlimited concurrency and unlimited volume from
# a single address. Two of the bench's own conclusions depend on it — the measured
# concurrency of 32 and the finding that an IP pool only costs throughput. Both are true
# only against a receiver that does not throttle.
#
# THE NUMBERS BELOW ARE AN ASSUMPTION, NOT A MEASUREMENT. The customer has supplied neither
# the destination-domain mix nor the limits actually observed in production, so these are
# typical values for a large MX. The report says so on every run; replace them as soon as
# real data exists, and do not quote a derived IP count as measured until then.
#
# WHAT A LIMIT COSTS ON THE POSTAL SIDE. Over any of these caps the sink answers 4xx, which
# Postal classifies as SoftFail and defers via HasLocking#retry_later:
#   retry_after = now + (1.3 ** attempts) * 5 minutes,  attempts capped at 18
# So the FIRST retry is five minutes out and the ladder spans about 31 hours, and neither
# number is configurable — the base period is hardcoded. A deferred recipient therefore does
# not come back inside a normal 900 s window. Measure a throttled arm on a PREFILLED queue:
# with a backlog the worker always has ready rows, the cap binds continuously, and the
# delivered rate is the answer being sought. On an empty queue the same run would measure
# the retry ladder instead.
bench_sink_profile: unlimited

bench_sink_profiles:
  # Current behaviour and the default: the receiver imposes nothing, so the result is an
  # upper bound for Postal rather than a forecast for production.
  unlimited:
    connection_count: 0
    connection_rate: 0
    message_rate: 0
    recipient_rate: 0
    rate_time_unit: "60s"

  # Typical behaviour of a large recipient provider. ASSUMPTION — see above.
  #
  # The four limits are not independent, and choosing them carelessly measures the wrong one.
  # Postal opens a new SMTP session roughly every 1.4 to 3.35 messages depending on whether a
  # pool is in use (measured, see docs/postal-internals.md), so a connection-rate cap of N per
  # minute permits only about 1.4N messages per minute. A first draft of this profile set the
  # connection rate to 30 and the message rate to 120: the connection rate bound at roughly a
  # third of the message rate, delivery fell to zero, and every rejection was a connection-rate
  # one. Worse, smtpd answers "421 ... too many connections" for the concurrency cap AND the
  # connection rate, so the two are indistinguishable in the reply — the breakdown is taken
  # from the log warnings for exactly that reason.
  #
  # So the connection rate is set high enough not to bind, and the VOLUME limit is the one
  # that does. That is what models a provider's throttling: it is volume per address that
  # providers meter, not the TCP sessions. 120 messages a minute is 2/s per address, which
  # sits in the same range as the 1.6-1.9 recipients/s one address was measured to deliver.
  #
  # The concurrency cap is kept but is not expected to fire on its own: at 10 the bench
  # produced no rejections at all, because worker threads spend much of their time in the
  # database and the effective session count never reaches it.
  provider:
    connection_count: 10
    connection_rate: 200
    message_rate: 120
    recipient_rate: 120
    rate_time_unit: "60s"

# The individual knobs stay separate variables rather than being read out of the profile at
# the point of use: the sink role, the report and calibrate.yml all read them, and -e on the
# command line has to keep working for a one-off arm.
postfix_sink_client_connection_limit: "{{ bench_sink_profiles[bench_sink_profile].connection_count }}"
postfix_sink_client_connection_rate_limit: "{{ bench_sink_profiles[bench_sink_profile].connection_rate }}"
postfix_sink_client_message_rate_limit: "{{ bench_sink_profiles[bench_sink_profile].message_rate }}"
postfix_sink_client_recipient_rate_limit: "{{ bench_sink_profiles[bench_sink_profile].recipient_rate }}"
postfix_sink_anvil_rate_time_unit: "{{ bench_sink_profiles[bench_sink_profile].rate_time_unit }}"

# How the drain arm decides it is finished.
#
#   exhaust — wait until no ready row is left. The historical behaviour and the right one
#             for an unthrottled sink, where a row leaves the queue for good.
#   window  — measure over a fixed window and report the state at its end.
#
# Why the second mode is needed. Under throttling a row does not leave the queue, it goes
# back into it with retry_after five minutes out, so "no ready rows" stops meaning "the work
# is done" and starts meaning "everything is either delivered or deferred". That is a real
# state and the loop does terminate on it, but the number it yields is not a drain rate: the
# denominator bench_drain_queue_ready_at_start counts rows that were never going to be
# delivered in this window. A fixed window measures the delivered rate under a binding cap,
# which is the quantity a throttled arm exists to find.
bench_drain_mode: "{{ 'window' if bench_sink_throttled | bool else 'exhaust' }}"

# Length of the observation window in window mode. Must exceed the sink's rate accounting
# unit by a good margin, or the measurement lands inside a single anvil bucket.
bench_drain_window_s: 600

# True when the receiver imposes anything at all. Guards the parts of the report that are
# only meaningful under throttling — above all the derived "IP addresses needed" figure,
# which without a binding limit would describe the ceiling of Postal rather than of the
# provider, and would be read as the opposite of what it means.
bench_sink_throttled: >-
  {{ ((postfix_sink_client_connection_limit | int)
      + (postfix_sink_client_connection_rate_limit | int)
      + (postfix_sink_client_message_rate_limit | int)
      + (postfix_sink_client_recipient_rate_limit | int)) > 0 }}


# Run class: debug (everything on one host, unsuitable for comparing builds)
# or scored (generator, SUT and sink on different hosts).
# Set automatically by preflight and included in the report.
bench_run_class: "{{ 'debug' if (groups['load_generators'] | intersect(groups['postal_workers'])) else 'scored' }}"

# Calibration: how many times faster than the target the generator-to-sink path must be.
# Without that headroom we measure Postfix while thinking we measure Postal.
bench_calibration_headroom: 2.0

# Polling interval of the lightweight samplers (queue depth, docker stats), seconds.
bench_sample_interval_s: 5

# Acceptable reconciliation discrepancy, as a fraction.
bench_reconcile_tolerance: 0.01

# Where reports are stored on the control machine.
bench_reports_dir: "{{ playbook_dir }}/../reports"

# --- Launching the generator ----------------------------------------------
# The command lives here rather than in role defaults for the same reason as the paths
# in 15-paths.yml: the generator is launched by several roles (bench_run, bench_prefill,
# bench_ingress), and a role default is only visible while that role is executing.
#
# The limits are applied here: without them the generator container competes
# with the system under test without any restriction, which is especially noticeable
# in the debug layout on a single machine.
bench_loadgen_argv:
  - docker
  - run
  - "--rm"
  - "--network=host"
  - "--cpus={{ loadgen_limits.cpus }}"
  - "--memory={{ loadgen_limits.memory }}"
  - "-v"
  - "{{ loadgen_dir }}:/scripts:ro"
  - "-v"
  - "{{ loadgen_results_dir }}:/results"
  - "-e"
  - "POSTAL_API_URL=http://{{ postal_api_addr }}"
  - "-e"
  - "POSTAL_WEB_HOST={{ postal_web_hostname }}"
  - "-e"
  - "POSTAL_API_KEY={{ postal_seed.api_key }}"
  - "-e"
  - "BENCH_RUN_ID={{ bench_run_id }}"
  - "-e"
  - "BENCH_DOMAIN={{ postal_test_domain }}"
  - "-e"
  - "BENCH_DOMAIN_COUNT={{ bench_profiles[bench_profile].destination_domains }}"
  - "-e"
  - "BENCH_MIME_SIZE={{ bench_profiles[bench_profile].mime_size_bytes }}"
  - "-e"
  - "BENCH_RATE={{ bench_target_rate }}"
  - "-e"
  - "BENCH_MAX_VU_FACTOR={{ bench_max_vu_factor }}"

# Pinning the generator to cores — only if it is set in the inventory.
# On a single machine this is the only way to stop the generator from stealing cores
# from the system under test.
bench_loadgen_cpuset_argv: "{{ ['--cpuset-cpus=' ~ loadgen_cpuset] if loadgen_cpuset | default('') else [] }}"
