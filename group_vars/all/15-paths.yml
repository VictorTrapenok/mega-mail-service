---
# Paths, ports and names used by SEVERAL roles and playbooks.
#
# They live here rather than in role defaults for a specific reason: a role default
# is only in scope while that role is executing. The reset, benchmark, calibrate and
# smoke playbooks reference the paths of Postal, the sink and the load generator
# without including the corresponding roles — coming from defaults, those values
# would simply be undefined there.

# --- Postal ---------------------------------------------------------------
postal_dir: /opt/postal-bench/postal
postal_config_dir: /opt/postal-bench/postal/config
# Docker build context for the fork in vendor/postal. Wiped and refilled on every build:
# unarchive replaces files but never removes them, so a file deleted from the fork would
# otherwise survive here and go on being built in.
postal_build_dir: /opt/postal-bench/build
# Source tree for the rspec suite. Separate from the build context above so running the
# suite on a host cannot disturb an image build on the same host.
postal_specs_dir: /opt/postal-bench/specs

# --- MariaDB --------------------------------------------------------------
mariadb_dir: /opt/postal-bench/mariadb
mariadb_port: 3306
# The container name is composed of the compose project name and the service name.
mariadb_container: "stand-db-mariadb-1"

# --- HTTP API load balancer -----------------------------------------------
# For the HTTP API only. SMTP load balancing is forbidden: HAProxy terminates TCP,
# and the sink would see the balancer's address instead of the outbound address that
# Postal bound to the socket — that would destroy the only end-to-end proof
# that IP binding works.
postal_lb_dir: /opt/postal-bench/lb
postal_lb_port: 5100
postal_lb_stats_port: 5101

# --- Internal DNS ---------------------------------------------------------
test_dns_dir: /opt/postal-bench/coredns
test_dns_port: 53
test_dns_resolv_conf: /opt/postal-bench/resolv.conf

# --- Sink -----------------------------------------------------------------
postfix_sink_dir: /opt/postal-bench/sink
postfix_sink_port: 25
# The marker by which delivery is counted independently of Postal.
postfix_sink_discard_token: "delivered-to-sink"
postfix_sink_log: /opt/postal-bench/sink/log/postfix.log

# --- Load generator and run -----------------------------------------------
loadgen_dir: /opt/postal-bench/loadgen
loadgen_results_dir: /opt/postal-bench/loadgen/results
bench_dir: /opt/postal-bench/run
