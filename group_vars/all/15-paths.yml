---
# Пути, порты и имена, которые используются НЕСКОЛЬКИМИ ролями и плейбуками.
#
# Они лежат здесь, а не в defaults ролей, по конкретной причине: default роли
# находится в области видимости только пока эта роль выполняется. Плейбуки
# reset, benchmark, calibrate и smoke обращаются к путям Postal, приёмника
# и генератора, не подключая соответствующие роли, — из defaults эти значения
# там были бы просто не определены.

# --- Postal ---------------------------------------------------------------
postal_dir: /opt/postal-bench/postal
postal_config_dir: /opt/postal-bench/postal/config

# --- MariaDB --------------------------------------------------------------
mariadb_dir: /opt/postal-bench/mariadb
mariadb_port: 3306
# Имя контейнера складывается из имени compose-проекта и имени сервиса.
mariadb_container: "stand-db-mariadb-1"

# --- Внутренний DNS -------------------------------------------------------
test_dns_dir: /opt/postal-bench/coredns
test_dns_port: 53
test_dns_resolv_conf: /opt/postal-bench/resolv.conf

# --- Приёмник -------------------------------------------------------------
postfix_sink_dir: /opt/postal-bench/sink
postfix_sink_port: 25
# Метка, по которой доставка считается независимо от Postal.
postfix_sink_discard_token: "delivered-to-sink"
postfix_sink_log: /opt/postal-bench/sink/log/postfix.log

# --- Генератор и прогон ---------------------------------------------------
loadgen_dir: /opt/postal-bench/loadgen
loadgen_results_dir: /opt/postal-bench/loadgen/results
bench_dir: /opt/postal-bench/run
